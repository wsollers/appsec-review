rules:
  - id: appsec-review.sei-cert.java.err07-j.throw-generic-exception
    languages: [java]
    severity: WARNING
    message: >-
      ERR07-J: throwing $EXC forces callers to catch overly broad types and hides the actual
      failure. Throw a specific exception type that describes the condition.
    metadata:
      pack: appsec-review/sei-cert
      cert: ERR07-J
      cert_standard: java
      source_language: java
      cert_url: https://cmu-sei.github.io/secure-coding-standards/sei-cert-oracle-coding-standard-for-java/rules/exceptional-behavior-err/err07-j
      cwe: [CWE-397]
      confidence: HIGH
      precision: medium
      coverage: PARTIAL
      technology: [java-language]
      min_engine_versions: {semgrep: 1.178.0, opengrep: 1.30.2}
      implementation_notes: >-
        Matches throw statements that construct RuntimeException, Exception, or Throwable, and method declarations that list those types in a throws clause. ERR07-J-EX0 (exception-sanitizing classes translating to a generic type) cannot be recognized syntactically and is reported for review. Rethrowing a generic exception held in a variable is not detected.
      license: MIT
    patterns:
      - pattern-either:
          - pattern: throw new $EXC(...);
          - pattern: throw new java.lang.$EXC(...);
      - metavariable-regex:
          metavariable: $EXC
          regex: ^(RuntimeException|Exception|Throwable)$

  - id: appsec-review.sei-cert.java.err07-j.declares-generic-exception
    languages: [java]
    severity: WARNING
    message: >-
      ERR07-J: this method declares that it throws $EXC, a type too general for callers to handle
      meaningfully. Declare the specific checked exceptions it can throw.
    metadata:
      pack: appsec-review/sei-cert
      cert: ERR07-J
      cert_standard: java
      source_language: java
      cert_url: https://cmu-sei.github.io/secure-coding-standards/sei-cert-oracle-coding-standard-for-java/rules/exceptional-behavior-err/err07-j
      cwe: [CWE-397]
      confidence: MEDIUM
      precision: medium
      coverage: PARTIAL
      technology: [java-language]
      min_engine_versions: {semgrep: 1.178.0, opengrep: 1.30.2}
      implementation_notes: >-
        Matches method declarations whose throws clause names Exception or Throwable. The main(String[]) entry point is excluded because no caller handles its exceptions. ERR07-J-EX0 is not recognized syntactically.
      license: MIT
    patterns:
      - pattern-either:
          - pattern: |
              $RET $METHOD(...) throws $EXC { ... }
          - pattern: |
              $RET $METHOD(...) throws $EXC, $OTHER { ... }
          - pattern: |
              $RET $METHOD(...) throws $OTHER, $EXC { ... }
      - metavariable-regex:
          metavariable: $EXC
          regex: ^(java\.lang\.)?(Exception|Throwable)$
      - pattern-not: |
          public static void main(String[] $ARGS) throws $EXC { ... }
      - focus-metavariable: $METHOD
