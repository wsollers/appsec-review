# Repository-authored gitleaks rules, used with the built-in rule set (useDefault).
#
# The built-in rules key on vendor token formats or on `name = "value"` shapes. A credential assigned to
# an array (`const char key[] = "..."`) or carrying an unrecognised prefix matches neither, so this adds
# one generic rule: an identifier containing a secret-sounding word, an optional array declarator, an
# assignment, and a long high-entropy string literal. A match is a lead for review, never a finding.
[extend]
useDefault = true

[[rules]]
id = "appsec-review-named-secret-literal"
description = "Secret-named identifier assigned a high-entropy string literal"
regex = '''(?i)\b[\w.-]{0,30}(?:api[_-]?key|secret|token|passw(?:or)?d|credential)[\w.-]{0,20}(?:\[\s*\])?\s*=\s*["']([A-Za-z0-9_\-+/=]{16,})["']'''
secretGroup = 1
entropy = 3.5
keywords = ["key", "secret", "token", "passw", "credential"]
