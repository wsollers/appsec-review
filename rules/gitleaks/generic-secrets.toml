# Repository gitleaks configuration: the built-in rules, with one of them widened.
#
# `generic-api-key` is gitleaks' rule for a key-like name assigned a high-entropy value. Its pattern allows
# only spaces, tabs, word characters, dots, hyphens and quotes between the name and the assignment, so an
# array declarator (`const char relay_api_key[] = "..."`) slips past it. Gitleaks merges a local rule with the
# same id field by field (config/config.go): the fields set here replace the built-in ones, every other field
# (entropy, keyword prefilter, allowlists, stop words) is inherited. This rule sets only `regex`, which is the
# built-in pattern of gitleaks 8.30.1 (cmd/generate/config/rules/generic.go and utils/generate.go) with one
# addition, `(?:\[\s*\])?` after the identifier. A match is a lead for review, never a finding.
#
# tests/test_cpp_memory_safety_rules.py checks that this pattern still reports everything the installed
# built-in rule reports, so a gitleaks upgrade that changes the built-in pattern fails the test.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
regex = '''[\w.-]{0,50}?(?i:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|passw(?:or)?d|secret|token)(?:[ \t\w.-]{0,20})(?:\[\s*\])?[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([\w.=-]{10,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:[\x60'"\s;]|\\[nr]|$)'''
