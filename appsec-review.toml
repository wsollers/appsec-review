[runtime]
runs_dir = "runs"
data_dir = "data"
metadata_dir = "runs/metadata"

[orchestration.dagster]
executor = "multiprocess"
max_concurrent = 8

[orchestration.dagster.pools]
scanner = 6
index = 4
lifecycle = 1
cpp_build = 4
cpp_analysis = 6
owasp_validator = 4
owasp_verification = 2
ci_linter = 8

