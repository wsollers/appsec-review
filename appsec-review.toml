[jobs.job_inference_security_review.steps.publication.tasks.publish_claim_ledger]
[jobs.job_inference_security_review.steps.publication.tasks.publish_handoff]

# Final publication gate (docs/operations/final-report.md). It re-verifies the accepted inference
# review handoff and the artifacts it binds from bytes, then classifies every finding package as
# publishable, verification backlog or withheld and names the limitations. It calls no model, so it
# has no provider or model settings, and it never reinterprets a claim state or ship-block status.
# max_packages bounds the finding packages one gate accounts for (the schema allows 10000).
[jobs.job_final_publication_gate]
name = "final_publication_gate"
workers = 1

[jobs.job_final_publication_gate.settings]
enabled = true
max_packages = 10000

[jobs.job_final_publication_gate.steps.load]
workers = 1
[jobs.job_final_publication_gate.steps.load.tasks.verify_review]

[jobs.job_final_publication_gate.steps.gate]
workers = 1
[jobs.job_final_publication_gate.steps.gate.tasks.classify]

[jobs.job_final_publication_gate.steps.acceptance]
workers = 1
[jobs.job_final_publication_gate.steps.acceptance.tasks.publish_handoff]

# Proof-of-concept generation (docs/operations/poc-generation.md): for each finding the judge agreed is
# correct (the review handoff's poc_candidates), a model writes a unit-test FUNCTION with no main that
# demonstrates the issue, deterministic validators check it on the clang AST in the build image, and the
# project's own compile command is replayed on it (syntax, object, sanitizer object, undefined symbols).
# Nothing is linked into an executable and nothing is run by the pipeline. The job reads no target tree:
# it uses the accepted native build workspace, compile database and image of job_language_build.
#
# SHIPPED DISABLED. enabled only decides membership in the automatic graph: when true the job sits after
# job_final_publication_gate and job_final_report_publication follows it; when false the report follows the
# gate exactly as before. It is invoked manually on a finished run with
# `appsec-review run job_poc_generation --run-id <id> --upstream-from-run`, which is allowed while disabled.
#
# max_candidates bounds the candidates attempted (confirmed claims first). accepted_judge_verdicts are the
# judge verdicts a candidate may carry. bounds, policy and build are the closed lists and numbers the
# validators and the compile check enforce; the allowlist wins over the denylist, and a call that is on
# neither is refused. Model, reasoning and budgets for the poc_writer role live in settings.models.
[jobs.job_poc_generation]
name = "poc_generation"
workers = 1

[jobs.job_poc_generation.settings]
enabled = false
workers = 1
max_candidates = 16
accepted_judge_verdicts = ["red_correct"]

[jobs.job_poc_generation.settings.models.default]
provider = "claude-cli"
model = "claude-haiku-5-5"
reasoning = "high"
max_input_tokens = 32000
max_output_tokens = 8000
max_queries = 8
max_turns = 6
timeout_seconds = 600

[jobs.job_poc_generation.settings.roles.poc_writer]
model_profile = "default"

[jobs.job_poc_generation.settings.retry]
max_attempts = 2
retry_on_timeout = true
retry_on_provider_error = true
retry_on_invalid_output = true

[jobs.job_poc_generation.settings.bounds]
max_function_lines = 80
max_file_bytes = 16384
max_includes = 12
max_list_items = 8
max_text_chars = 600
max_string_literal_bytes = 256
max_loop_iterations = 4096
max_array_elements = 65536
max_violations = 50

[jobs.job_poc_generation.settings.policy]
# Headers a PoC may include besides the project's own (found on the sink translation unit's include path).
allowed_std_headers = ["array", "cstddef", "cstdint", "cstring", "limits", "string", "string_view", "utility",
                       "vector", "stddef.h", "stdint.h", "stdbool.h", "string.h", "limits.h"]
project_header_suffixes = [".h", ".hh", ".hpp", ".hxx"]
# sink_and_path: a PoC may call the sink function and the functions on the brief's call path.
# any_project_function: any function declared in the project tree.
project_calls = "sink_and_path"
# The closed allowlist. An entry ending in :: allows everything below that scope.
call_allowlist = ["memcpy", "memmove", "memset", "memcmp", "memchr", "strlen", "strnlen", "strcmp", "strncmp",
                  "strchr", "std::min", "std::max", "std::move", "std::size", "std::fill", "std::fill_n",
                  "std::copy", "std::copy_n", "std::equal", "std::begin", "std::end", "std::addressof",
                  "std::swap", "std::array::", "std::basic_string::", "std::basic_string_view::", "std::vector::",
                  "std::numeric_limits::"]
type_allowlist = ["std::uint8_t", "std::uint16_t", "std::uint32_t", "std::uint64_t", "std::int8_t", "std::int16_t",
                  "std::int32_t", "std::int64_t", "std::size_t", "std::ptrdiff_t", "std::byte", "std::nullptr_t",
                  "uint8_t", "uint16_t", "uint32_t", "uint64_t", "int8_t", "int16_t", "int32_t", "int64_t",
                  "size_t", "ptrdiff_t", "std::string", "std::string_view", "std::basic_string",
                  "std::basic_string_view", "std::char_traits", "std::allocator", "std::vector", "std::array"]

# Names the validators report by category when a call is refused; the allowlist above still decides.
[jobs.job_poc_generation.settings.policy.call_denylist]
process = ["fork", "vfork", "clone", "execl", "execle", "execlp", "execv", "execve", "execvp", "execvpe",
           "fexecve", "posix_spawn", "posix_spawnp", "wait", "waitpid", "waitid", "kill", "killpg", "prctl",
           "ptrace", "setuid", "setgid", "seteuid", "setreuid", "setresuid", "chroot", "pthread_create",
           "thrd_create", "std::thread::", "std::jthread::", "std::async", "sleep", "usleep", "nanosleep"]
shell = ["system", "popen", "pclose", "WinExec", "ShellExecute", "ShellExecuteA", "ShellExecuteW",
         "CreateProcess", "CreateProcessA", "CreateProcessW"]
network = ["socket", "socketpair", "connect", "bind", "listen", "accept", "accept4", "send", "sendto", "sendmsg",
           "recv", "recvfrom", "recvmsg", "shutdown", "getaddrinfo", "freeaddrinfo", "gethostbyname",
           "gethostbyaddr", "getnameinfo", "inet_addr", "inet_aton", "inet_pton", "inet_ntop", "setsockopt",
           "getsockopt", "poll", "select", "epoll_create", "epoll_wait", "curl_easy_init", "curl_easy_perform",
           "SSL_connect", "SSL_new"]
dynamic_loading = ["dlopen", "dlsym", "dlmopen", "dlclose", "LoadLibrary", "LoadLibraryA", "LoadLibraryW",
                   "GetProcAddress"]
file_system = ["open", "openat", "creat", "fopen", "freopen", "fdopen", "tmpfile", "tmpnam", "mkstemp", "mktemp",
               "read", "write", "pread", "pwrite", "close", "fread", "fwrite", "fgets", "fputs", "fprintf",
               "fscanf", "remove", "unlink", "unlinkat", "rename", "renameat", "mkdir", "rmdir", "chmod", "chown",
               "truncate", "ftruncate", "symlink", "link", "readlink", "realpath", "opendir", "readdir", "stat",
               "lstat", "fstat", "access", "chdir", "fchdir", "getcwd", "mmap", "munmap", "mprotect",
               "std::ifstream", "std::ofstream", "std::fstream", "std::filesystem::", "std::basic_ifstream::",
               "std::basic_ofstream::", "std::basic_fstream::"]
environment = ["getenv", "secure_getenv", "setenv", "putenv", "unsetenv", "clearenv", "environ"]
control = ["abort", "exit", "_exit", "_Exit", "quick_exit", "atexit", "at_quick_exit", "raise", "signal",
           "sigaction", "longjmp", "setjmp", "_longjmp", "siglongjmp", "sigsetjmp", "std::terminate", "alloca",
           "malloc", "calloc", "realloc", "free", "posix_memalign", "aligned_alloc"]

[jobs.job_poc_generation.settings.build]
command_timeout_seconds = 300
output_bytes = 8388608
workspace_file_limit = 20000
workspace_bytes_limit = 1073741824
debug_flags = ["-g", "-O0"]
sanitizer_flags = ["-fsanitize=address,undefined", "-fno-omit-frame-pointer"]
# Libraries whose exported symbols may satisfy the object's undefined symbols (read with nm -D in the
# build image), and prefixes of runtime symbols that the compiler adds (sanitizer runtimes, the GOT).
runtime_libraries = ["/lib/x86_64-linux-gnu/libc.so.6", "/lib/x86_64-linux-gnu/libm.so.6",
                     "/lib/x86_64-linux-gnu/libstdc++.so.6", "/lib/x86_64-linux-gnu/libgcc_s.so.1"]
runtime_symbol_prefixes = ["__asan_", "__ubsan_", "__sanitizer_", "_GLOBAL_OFFSET_TABLE_"]
object_limit = 512
scratch_directory = ".appsec-poc"

[jobs.job_poc_generation.settings.build.ast_compilers]
c = "clang"
cxx = "clang++"

[jobs.job_poc_generation.settings.brief]
view_bytes = 49152
view_source_lines = 160
view_type_declarations = 6
declaration_lines = 30
max_brief_bytes = 131072
max_source_files = 64

[jobs.job_poc_generation.steps.load]
workers = 1
[jobs.job_poc_generation.steps.load.tasks.verify_inputs]

[jobs.job_poc_generation.steps.plan]
workers = 1
[jobs.job_poc_generation.steps.plan.tasks.briefs]

[jobs.job_poc_generation.steps.write]
workers = 1
[jobs.job_poc_generation.steps.write.tasks.poc_writer]

[jobs.job_poc_generation.steps.validate]
workers = 1
[jobs.job_poc_generation.steps.validate.tasks.policy]

[jobs.job_poc_generation.steps.compile]
workers = 1
[jobs.job_poc_generation.steps.compile.tasks.build_check]

[jobs.job_poc_generation.steps.package]
workers = 1
[jobs.job_poc_generation.steps.package.tasks.files]

[jobs.job_poc_generation.steps.publish]
workers = 1
[jobs.job_poc_generation.steps.publish.tasks.publish_handoff]

# Final report publication (docs/operations/final-report.md): the terminal job. It reads only the
# accepted gate handoff and the artifacts the gate binds, and writes final-report.json and a
# deterministic final-report.md. It calls no model. The two settings only shorten identifier lists in
# the Markdown; the JSON always carries every identifier. PDF rendering is a later step.
[jobs.job_final_report_publication]
name = "final_report_publication"
workers = 1

[jobs.job_final_report_publication.settings]
enabled = true
markdown_evidence_ids = 8
markdown_gap_ids = 16

[jobs.job_final_report_publication.steps.load]
workers = 1
[jobs.job_final_report_publication.steps.load.tasks.accepted_gate]

[jobs.job_final_report_publication.steps.report]
workers = 1
[jobs.job_final_report_publication.steps.report.tasks.assemble]
[jobs.job_final_report_publication.steps.report.tasks.render]

[jobs.job_final_report_publication.steps.acceptance]
workers = 1
[jobs.job_final_report_publication.steps.acceptance.tasks.publish_handoff]

# ---------------------------------------------------------------------------------------------------------
# Banned and unsafe C/C++ functions. A call to a listed name in C or C++ source is reported by Semgrep and
# Opengrep as a review lead: `high` at ERROR (reported as high severity), `warning` at WARNING. A match is
# a lead, never a finding: a name can be called safely, and an unsafe call need not be on any list.
#
# The names are Microsoft's Security Development Lifecycle `banned.h` (167 names, 150 default and 17 at its
# pedantic level 3). The tiers are ours: unbounded or unsafe contracts are `high`; bounded-but-error-prone
# "n" functions, strtok, Microsoft's level-3 group and the MAX_PATH path APIs are `warning`. Move a name
# between tiers, delete one that is too noisy for your code (strlen is the usual one) or append your own
# (for example POSIX: mktemp, tmpnam, getwd). memcpy is NOT on Microsoft's list; an unbounded copy length
# is covered by the cpp-copy-length-not-bounded rule in rules/semgrep/review-signals.yml.
#
# rules/semgrep/banned-functions.yml is generated from this table, never edited by hand. After editing:
#   python -m appsec_review.rulepacks.banned_functions --write
# A test fails if the file drifts and the evidence job refuses to run a file that does not match.
[banned_functions]
source = "https://github.com/microsoft/ChakraCore/blob/master/lib/Common/Banned.h"
reference = "https://msdn.microsoft.com/en-us/library/bb288454.aspx"
retrieved = "2026-10-20"
licence = "MIT (Microsoft banned.h, SDL 5.0 list; function names only)"

high = [
  # strcpy family: no destination size
  "strcpy", "strcpyA", "strcpyW", "wcscpy", "_tcscpy", "_mbscpy", "StrCpy", "StrCpyA", "StrCpyW",
  "lstrcpy", "lstrcpyA", "lstrcpyW", "_tccpy", "_mbccpy", "_ftcscpy",
  # strcat family: no destination size
  "strcat", "strcatA", "strcatW", "wcscat", "_tcscat", "_mbscat", "StrCat", "StrCatA", "StrCatW",
  "lstrcat", "lstrcatA", "lstrcatW", "StrCatBuff", "StrCatBuffA", "StrCatBuffW", "StrCatChainW",
  "_tccat", "_mbccat", "_ftcscat",
  # vsprintf family: no destination size
  "wvsprintf", "wvsprintfA", "wvsprintfW", "vsprintf", "_vstprintf", "vswprintf",
  # IsBad*Ptr: unreliable pointer probes
  "IsBadWritePtr", "IsBadHugeWritePtr", "IsBadReadPtr", "IsBadHugeReadPtr", "IsBadCodePtr",
  "IsBadStringPtr",
  # gets family: unbounded read
  "gets", "_getts", "_gettws",
  # CopyMemory family: no destination size
  "RtlCopyMemory", "CopyMemory",
  # sprintf family, unbounded
  "sprintfW", "sprintfA", "wsprintf", "wsprintfW", "wsprintfA", "sprintf", "swprintf", "_stprintf",
  # makepath family: unbounded path assembly
  "makepath", "_tmakepath", "_makepath", "_wmakepath",
  # splitpath family: unbounded path split
  "_splitpath", "_tsplitpath", "_wsplitpath",
  # scanf family: unbounded %s
  "scanf", "wscanf", "_tscanf", "sscanf", "swscanf", "_stscanf", "snscanf", "snwscanf", "_sntscanf",
  # itoa family: no buffer size
  "_itoa", "_itow", "_i64toa", "_i64tow", "_ui64toa", "_ui64tot", "_ui64tow", "_ultoa", "_ultot",
  "_ultow",
]

warning = [
  # strncpy family: bounded, but no guaranteed termination
  "strncpy", "wcsncpy", "_tcsncpy", "_mbsncpy", "_mbsnbcpy", "StrCpyN", "StrCpyNA", "StrCpyNW",
  "StrNCpy", "strcpynA", "StrNCpyA", "StrNCpyW", "lstrcpyn", "lstrcpynA", "lstrcpynW",
  # strncat family: bounded, but easy to get the count wrong
  "strncat", "wcsncat", "_tcsncat", "_mbsncat", "_mbsnbcat", "StrCatN", "StrCatNA", "StrCatNW",
  "StrNCat", "StrNCatA", "StrNCatW", "lstrncat", "lstrcatnA", "lstrcatnW", "lstrcatn",
  # sprintf family, n-variants: bounded, no guaranteed termination
  "wnsprintf", "wnsprintfA", "wnsprintfW", "_snwprintf", "_snprintf", "_sntprintf",
  # vsnprintf family: bounded, but no guaranteed termination
  "_vsnprintf", "_vsnwprintf", "_vsntprintf", "wvnsprintf", "wvnsprintfA", "wvnsprintfW",
  # strtok family: modifies its input, not reentrant
  "strtok", "_tcstok", "wcstok", "_mbstok",
  # CharToOem family (Microsoft level 3)
  "CharToOem", "CharToOemA", "CharToOemW", "OemToChar", "OemToCharA", "OemToCharW", "CharToOemBuffA",
  "CharToOemBuffW",
  # alloca family (Microsoft level 3): stack exhaustion
  "alloca", "_alloca",
  # strlen family (Microsoft level 3): unterminated input
  "strlen", "wcslen", "_mbslen", "_mbstrlen", "StrLen", "lstrlen",
  # ChangeWindowMessageFilter (Microsoft level 3)
  "ChangeWindowMessageFilter",
  # Path API: assumes MAX_PATH (Microsoft banned.h)
  "PathAddBackslash", "PathAddBackslashA", "PathAddBackslashW",
  # Path API: assumes MAX_PATH (Microsoft banned.h)
  "PathAddExtension", "PathAddExtensionA", "PathAddExtensionW",
  # Path API: assumes MAX_PATH (Microsoft banned.h)
  "PathAppend", "PathAppendA", "PathAppendW",
  # Path API: assumes MAX_PATH (Microsoft banned.h)
  "PathCanonicalize", "PathCanonicalizeA", "PathCanonicalizeW",
  # Path API: assumes MAX_PATH (Microsoft banned.h)
  "PathCombine", "PathCombineA", "PathCombineW",
  # Path API: assumes MAX_PATH (Microsoft banned.h)
  "PathRenameExtension", "PathRenameExtensionA", "PathRenameExtensionW",
]

# Not banned: ordinary memory, string, comparison and format calls where size, bounds, termination,
# null-check and format-string mistakes happen. Reported at INFO as leads for review, never as findings.
review = [
  # allocation and release
  "malloc", "calloc", "realloc", "reallocarray", "free", "aligned_alloc", "posix_memalign", "strdup", "strndup",
  # raw memory copy and comparison
  "memcpy", "memmove", "memset", "memcmp", "memchr", "bcopy", "bzero", "wmemcpy", "wmemmove",
  # string comparison and search
  "strcmp", "strncmp", "strcasecmp", "strncasecmp", "strcoll", "strchr", "strrchr", "strstr", "strcspn", "strspn",
  # formatted output and input
  "printf", "fprintf", "dprintf", "snprintf", "vprintf", "vfprintf", "syslog", "vsyslog",
  "fscanf", "vscanf",
  # conversion, environment and process
  "atoi", "atol", "atoll", "atof", "getenv", "system", "popen", "realpath", "rand", "tmpnam", "mktemp",
]
