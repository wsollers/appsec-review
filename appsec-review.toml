[runtime]
runs_dir = "runs"
data_dir = "data"
metadata_dir = "runs/metadata"

[orchestration.dagster]
executor = "multiprocess"
max_concurrent = 8

[orchestration.dagster.pools]
scanner = 6
index = 4
lifecycle = 1
owasp_validator = 4
owasp_verification = 2

[jobs.job_third_party_data_sync]
name = "third_party_data_sync"
workers = 3

[jobs.job_third_party_data_sync.schedule]
enabled = true
cron = "0 0 * * *"
timezone = "UTC"

[jobs.job_third_party_data_sync.steps.nvd_sync]
workers = 1

[jobs.job_third_party_data_sync.steps.nvd_sync.settings]
feed_root = "data/feeds/nvd"
api_key_env = "NVD_API_KEY"
first_year = 2002
page_size = 2000
max_window_days = 119
request_delay_with_key_seconds = 0.6
request_delay_without_key_seconds = 6.0
max_download_bytes = 536870912
max_api_response_bytes = 67108864

[jobs.job_third_party_data_sync.steps.nvd_sync.tasks.fetch]
workers = 1

[jobs.job_third_party_data_sync.steps.nvd_sync.tasks.process]
workers = 1

[jobs.job_third_party_data_sync.steps.nvd_sync.tasks.publish]
workers = 1

[jobs.job_third_party_data_sync.steps.osv_sync]
workers = 1

[jobs.job_third_party_data_sync.steps.osv_sync.settings]
feed_root = "data/feeds/osv"
ecosystems = ["PyPI"]
max_archive_bytes = 536870912
max_uncompressed_bytes = 2147483648
max_records = 500000
max_lookup_results = 500
timeout_seconds = 300

[jobs.job_third_party_data_sync.steps.osv_sync.tasks.fetch]
workers = 1

[jobs.job_third_party_data_sync.steps.osv_sync.tasks.index]
workers = 1

[jobs.job_third_party_data_sync.steps.osv_sync.tasks.publish]
workers = 1

[jobs.job_third_party_data_sync.steps.mitre_sync]
workers = 1

[jobs.job_third_party_data_sync.steps.mitre_sync.settings]
