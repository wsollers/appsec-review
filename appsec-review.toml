# Near-terminal inference security review (docs/architecture/inference-security-review.md).
# Typed and validated by config/inference_review.py; registered in runtime/registry.py.
# teams.review_teams and the Dagster pool limits are
# capacity, settable by a local overlay (APPSEC_REVIEW_CONFIG_OVERLAY) and never fingerprinted.
[jobs.job_inference_security_review]
name = "inference_security_review"
workers = 8

[jobs.job_inference_security_review.settings.rounds]
max_rounds = 3
stable_rounds_required = 1
max_active_claims = 500
max_attack_chains = 50

[jobs.job_inference_security_review.settings.teams]
review_teams = 5
red_per_team = 3
blue_per_team = 2
verifier_per_team = 1

[jobs.job_inference_security_review.settings.lanes]
lead_admission = ["critical", "high", "unknown"]
# KEV-listed advisory leads enter lane A whatever their reported severity (EPSS is context only).
lead_admission_kev = true
# Opt-in medium/low exploration uses existing team-package capacity, never an extra budget.
exploration_enabled = false
exploration_reserve = 1
lead_budget_share = 0.5
lead_max_claims_per_package = 3
hunt_max_units = 50
hunt_max_claims_per_package = 5
hunt_panel_rule = "hunt-panel/1"
incomplete_gap_ratio = 0.25

# Closed limits on a red cell's red-discovery-result/1 (docs/architecture/red-discovery-output.md,
# admission rule 1). They tighten the schema's hard ceilings; a result over any limit is rejected as
# a schema_error cell gap. Changing one changes the red cell validator and therefore red cell reuse.
[jobs.job_inference_security_review.settings.red_output]
max_result_bytes = 65536
max_proposals = 8
max_obligations = 48
max_taint_paths = 8
max_path_nodes = 16
max_chain_seeds = 4
max_chain_steps = 8
max_evidence_refs = 64
max_evidence_requests = 16
max_gaps = 32
max_text_chars = 2000

# Lane B review-unit rank weights (review-unit-rank/2), in points of the 0-1000 signal scale. These
# defaults are the shipped rank; changing one reorders units and the hunt cutoff. See
# docs/operations/inference-security-review.md "Tuning lane B ranking".
[jobs.job_inference_security_review.settings.ranking]
lps = 1000                           # full review-prioritization (LPS) score
sii = 1000                           # full source-history instability (SII) score
hotspot = 1000                       # full hotspot score
tag_density = 1000                   # tag density at tag_density_full_tags_per_file tags per file
tag_density_full_tags_per_file = 4
lead_hint_medium = 100               # per medium lead hint
lead_hint_low = 30                   # per low lead hint
lead_hint_info = 10                  # per info lead hint
lead_hints_max = 1000                # cap on the summed lead hints
advisory_kev = 250                   # any advisory in the unit is CISA KEV-listed
advisory_epss = 250                  # times the unit's highest EPSS percentile

# Package assembly bounds; admission and the hunt cutoff are lanes.lead_admission and lanes.hunt_max_units.
[jobs.job_inference_security_review.settings.packages]
hunt_menu_partition_size = 25
unit_max_files = 200
max_context_entries = 64
max_package_bytes = 65536
max_page_size = 20
max_pages = 5
max_depth = 4
# Finding-lead context (schema v5): SVF records at the lead's line and its callers in the code graph.
max_memory_context_entries = 24
max_callers = 16
caller_depth = 2
# Model-facing package view (docs/architecture/review-protocol-v2.md section 4): the view of one package is
# trimmed to this byte budget, with omitted counts and a truncated gap.
max_view_bytes = 49152
max_view_source_lines = 160
max_view_type_declarations = 6

[jobs.job_inference_security_review.settings.budgets]
budget_team_packages = 200
max_model_turns = 12000
max_input_tokens = 60000000
max_output_tokens = 6000000
max_retrieval_queries = 40000
timeout_seconds = 28800

[jobs.job_inference_security_review.settings.retry]
max_attempts = 2
retry_on_timeout = true
retry_on_provider_error = true
retry_on_invalid_output = true
backoff_seconds = [2, 10]

[jobs.job_inference_security_review.settings.models.default]
provider = "claude-cli"
model = "claude-haiku-5-5"
reasoning = "high"
max_input_tokens = 32000
max_output_tokens = 8000
max_queries = 40
max_turns = 12
timeout_seconds = 600

# Lead severity triage (settings.triage): one short, tool-free turn per batch of 20 leads. The same provider and
# Haiku model as "default" with small limits, so it is cheap in dev. profiles/prod.toml upgrades the model while
# keeping these bounded, tool-free limits. max_queries must stay 0: triage grants no retrieval.
[jobs.job_inference_security_review.settings.models.triage]
provider = "claude-cli"
model = "claude-haiku-5-5"
reasoning = "medium"
max_input_tokens = 64000
max_output_tokens = 16000
max_queries = 0
max_turns = 1
timeout_seconds = 600

[jobs.job_inference_security_review.settings.roles.independent_verifier]
workers = 4
model_profile = "default"
require_distinct_from_roles = ["hypothesis_hunter", "red_team_analyst", "blue_team_refuter"]

# The adjudication judge (docs/architecture/review-judge-and-poc.md section 3). After the red, blue and blind
# verifier cells of a team, a judge sees the labelled package and the two sides as A and B in a deterministic
# shuffled order, and records which side is correct. It never sets a claim state: R5 and R6 are unchanged, and
# confirmation still needs the blind verifier. `when` is "all" (every claim red affirmed) or "disagreement"
# (red affirmed and blue contradicts, qualifies, leaves a predicate unresolved, or the blue cells disagree).
# `require_distinct_from_roles` records judge_model_distinct and is never required. Set enabled = false to
# switch the judge off; changing anything here changes the judge cells' fingerprints and the configuration hash.
[jobs.job_inference_security_review.settings.roles.adjudication_judge]
enabled = true
when = "all"
judges_per_claim = 1
workers = 4
model_profile = "default"
require_distinct_from_roles = ["hypothesis_hunter", "red_team_analyst", "blue_team_refuter"]
max_why_chars = 600                  # each side's reason, as shown to the judge
max_cited_rows_per_side = 12         # distinct rows each side may cite to the judge
max_cited_row_chars = 400            # resolved content shown per cited row

# Review-judge-and-poc.md section 4: the handoff lists a claim in poc_candidates when it is supported or confirmed,
# the judge said red_correct (partly only when accept_partly), it carries a resolved poc_basis, and its
# application_risk_matrix/2 technical severity is one of risk_ratings.
[jobs.job_inference_security_review.settings.poc_candidates]
accept_partly = false
risk_ratings = ["medium", "high", "critical"]

# Decision 2: a ship-blocking candidate is published as ship_blocking only when its verifier's model
# profile (provider + model) differs from every red cell's on the claim; otherwise it is published as
# ship_blocking_pending_distinct_verification. Confirmation (R5/R6) never depends on it. With every
# role on the default profile, the job records a warning and ship-blocking findings stay pending; see
# docs/operations/inference-security-review.md "Configuring a distinct verifier".
[jobs.job_inference_security_review.settings.verification]
require_distinct_model_for_ship_blocking = true

# Lead severity triage (docs/operations/lead-severity-triage.md). A lead whose scanner reported no severity gets
# an audited assessed severity before package assembly: first the deterministic table below
# (lead-severity-rules/1), then the pinned MITRE CWE catalog (cwe-impact-derivation/1), then a short model pass
# (model profile "triage", closed result appsec-review/lead-triage-result/1). reported_severity is never
# rewritten; the assessed severity only orders and admits leads and never feeds scoring, ship-block or claim
# states. A lead nothing decides stays unknown with a named gap. enabled = false restores the earlier behaviour.
# Editing a row, the bounds or the profile changes every triage fingerprint, so cached results are not reused.
[jobs.job_inference_security_review.settings.triage]
enabled = true
batch_size = 20
model_profile = "triage"
max_leads = 200
max_excerpt_lines = 24
max_reason_chars = 200
# lead-severity-rules/1. scanner is the tool id without its "tool-" prefix; rule "*" is every rule of the
# scanner; a row with scanner "*" and a cwe matches any scanner's lead with that rule CWE. The most specific
# row decides: scanner and rule, then scanner, then CWE. Seeded from the leads of the sample review run
# (gitleaks, CodeQL and Clang findings) plus the documented Dockerfile and shell rule ids.
rules = [
  { scanner = "gitleaks", rule = "*", severity = "high", basis = "rule_semantics", reason = "Hard-coded credential in the repository (CWE-798): everyone who can read the source holds it; real exposure depends on its scope." },
  { scanner = "*", cwe = "CWE-798", severity = "high", basis = "rule_semantics", reason = "Use of hard-coded credentials (CWE-798): the secret travels with the source." },
  { scanner = "codeql", rule = "cpp/command-line-injection", severity = "high", basis = "rule_semantics", reason = "OS command built from untrusted input (CWE-78): the catalog impact is execution of unauthorized commands." },
  { scanner = "codeql", rule = "cpp/tainted-format-string", severity = "high", basis = "rule_semantics", reason = "Untrusted format string (CWE-134) can read or write memory." },
  { scanner = "codeql", rule = "cpp/uncontrolled-process-operation", severity = "high", basis = "rule_semantics", reason = "Untrusted input selects the process or library to run (CWE-114)." },
  { scanner = "codeql", rule = "cpp/uncontrolled-allocation-size", severity = "medium", basis = "rule_semantics", reason = "Untrusted allocation size (CWE-789) leads to resource exhaustion or size arithmetic faults." },
  { scanner = "codeql", rule = "cpp/non-constant-format", severity = "medium", basis = "rule_semantics", reason = "Non-constant format string (CWE-134): exploitable only when the string is attacker influenced." },
  { scanner = "clang-static-analysis", rule = "core.NullDereference", severity = "medium", basis = "rule_semantics", reason = "Null pointer dereference (CWE-476): a crash on the analysed path, rarely more." },
  { scanner = "clang-static-analysis", rule = "clang-analyzer-core.NullDereference", severity = "medium", basis = "rule_semantics", reason = "Null pointer dereference (CWE-476): a crash on the analysed path, rarely more." },
  { scanner = "clang-static-analysis", rule = "cplusplus.NewDelete", severity = "high", basis = "rule_semantics", reason = "Use after free or double free on the analysed path (CWE-416, CWE-415): memory corruption." },
  { scanner = "clang-static-analysis", rule = "clang-analyzer-cplusplus.NewDelete", severity = "high", basis = "rule_semantics", reason = "Use after free or double free on the analysed path (CWE-416, CWE-415): memory corruption." },
  { scanner = "clang-static-analysis", rule = "cert-env33-c", severity = "medium", basis = "rule_semantics", reason = "Call to the command processor (CERT ENV33-C): command injection when the string is influenced." },
  { scanner = "clang-static-analysis", rule = "clang-diagnostic-format-security", severity = "medium", basis = "rule_semantics", reason = "Non-literal format string diagnostic (CWE-134): exploitable only with attacker influence." },
  { scanner = "clang-static-analysis", rule = "cert-err33-c", severity = "low", basis = "rule_semantics", reason = "Unchecked return value of a library call (CERT ERR33-C): a robustness gap." },
  { scanner = "clang-static-analysis", rule = "cert-err34-c", severity = "low", basis = "rule_semantics", reason = "Unchecked string-to-number conversion (CERT ERR34-C): a robustness gap." },
  { scanner = "clang-static-analysis", rule = "concurrency-mt-unsafe", severity = "low", basis = "rule_semantics", reason = "Thread-unsafe library call: a reliability gap unless threads are attacker driven." },
  { scanner = "clang-static-analysis", rule = "bugprone-easily-swappable-parameters", severity = "info", basis = "rule_semantics", reason = "Readability warning on a signature; no security consequence." },
  { scanner = "checkov", rule = "CKV_DOCKER_3", severity = "medium", basis = "rule_semantics", reason = "No non-root user is created (CWE-250): a container escape or file write runs as root." },
  { scanner = "checkov", rule = "CKV_DOCKER_8", severity = "medium", basis = "rule_semantics", reason = "The last USER is root (CWE-250): the container process keeps full privileges." },
  { scanner = "checkov", rule = "CKV_DOCKER_1", severity = "medium", basis = "rule_semantics", reason = "Port 22 is exposed: a remote login surface inside the container." },
  { scanner = "checkov", rule = "CKV_DOCKER_2", severity = "low", basis = "rule_semantics", reason = "No HEALTHCHECK: an availability and operations gap." },
  { scanner = "checkov", rule = "CKV_DOCKER_4", severity = "low", basis = "rule_semantics", reason = "ADD instead of COPY can fetch remote content or unpack archives unexpectedly." },
  { scanner = "checkov", rule = "CKV_DOCKER_7", severity = "low", basis = "rule_semantics", reason = "The base image is not pinned to a version tag: builds are not reproducible." },
  { scanner = "hadolint", rule = "DL3002", severity = "medium", basis = "rule_semantics", reason = "The last USER is root (CWE-250): the container process keeps full privileges." },
  { scanner = "hadolint", rule = "DL3004", severity = "medium", basis = "rule_semantics", reason = "sudo inside a container image hides privilege use and widens what a compromise can do." },
  { scanner = "hadolint", rule = "DL3006", severity = "low", basis = "rule_semantics", reason = "The image is not tagged with an explicit version: builds are not reproducible." },
  { scanner = "hadolint", rule = "DL3007", severity = "low", basis = "rule_semantics", reason = "The image uses the latest tag: builds are not reproducible." },
  { scanner = "hadolint", rule = "DL3020", severity = "low", basis = "rule_semantics", reason = "ADD instead of COPY can fetch remote content or unpack archives unexpectedly." },
  { scanner = "hadolint", rule = "DL4006", severity = "low", basis = "rule_semantics", reason = "A pipe without pipefail can hide a failed step in the image build." },
  { scanner = "hadolint", rule = "DL3059", severity = "info", basis = "rule_semantics", reason = "Style: consecutive RUN instructions could be merged." },
  { scanner = "shellcheck", rule = "SC2086", severity = "medium", basis = "rule_semantics", reason = "Unquoted expansion splits and globs (CWE-78 when the value is influenced)." },
  { scanner = "shellcheck", rule = "SC2046", severity = "medium", basis = "rule_semantics", reason = "Unquoted command substitution splits and globs (CWE-78 when the value is influenced)." },
  { scanner = "shellcheck", rule = "SC2164", severity = "low", basis = "rule_semantics", reason = "cd without a failure branch continues in the wrong directory." },
  { scanner = "shellcheck", rule = "SC2034", severity = "info", basis = "rule_semantics", reason = "Unused variable: no security consequence." },
  { scanner = "shellcheck", rule = "SC2155", severity = "info", basis = "rule_semantics", reason = "Declare and assign separately to keep the exit status: a style point." },
]

# Decision 1: ship-block-policy/1. A confirmed finding blocks when application_risk_matrix/3 rates its
# technical severity in blocking_technical_severities, or when it is a dependency finding (proposed
# from a lane A lead of a dependency_lead_families family) with a KEV-listed reference input. CVSS and
# SSVC outputs are displayed context only and never decide.
[jobs.job_inference_security_review.settings.ship_block]
blocking_technical_severities = ["high", "critical"]
kev_dependency_blocks = true
dependency_lead_families = ["dependency_advisory", "artifact_scanner"]

[jobs.job_inference_security_review.settings.routing]
persona_rule = "persona-routing/1"
stack_rule = "stack-routing/1"

[jobs.job_inference_security_review.settings.scoring]
enabled_providers = ["cvss_v4", "application_risk_matrix", "ssvc_decision"]
priority_policy = "organization_default/1"
override_policy = "review_lead_only/1"

[jobs.job_inference_security_review.settings.scoring.providers.cvss_v4]
implementation = "first-reference-compatible/1"
metric_groups = ["base", "threat", "environmental", "supplemental"]

# application_risk_matrix/3 rates score-factors/1 evidence factors. Points are summed per dimension
# (a missing factor is unknown: its minimum and maximum points bound the rating, and a rating that the
# missing factors could change is withheld as unrated) and must not decrease along a factor's scale. Replacing a table
# replaces it whole. See docs/operations/inference-security-review.md "Tuning scoring".
[jobs.job_inference_security_review.settings.scoring.providers.application_risk_matrix]
implementation = "application_risk_matrix/3"

[jobs.job_inference_security_review.settings.scoring.providers.application_risk_matrix.exploitability.points]
verification = { supported = 20, confirmed = 40 }
taint_path = { code_evidence = 10, tool_observation = 15, codeql_path_observation = 20, graph_dataflow_path = 25 }
attacker_control = { internal = 0, direct_unclassified = 10, local = 15, remote = 25 }
guard_absent = { code_evidence = 15, tool_observation = 15, graph_fact = 20 }
exposure = { local = 0, internal_network = 5, public = 10 }

[jobs.job_inference_security_review.settings.scoring.providers.application_risk_matrix.exploitability.bands]
medium = 40
high = 75

[jobs.job_inference_security_review.settings.scoring.providers.application_risk_matrix.environmental.points]
exposure = { local = 5, internal_network = 10, public = 30 }
privilege = { sandboxed = 0, elevated = 25 }
data_sensitivity = { sensitive = 20, secret = 30 }

[jobs.job_inference_security_review.settings.scoring.providers.application_risk_matrix.environmental.bands]
medium = 25
high = 50

# Technical severity: impact class (row) x exploitability rating (column) -> band.
[jobs.job_inference_security_review.settings.scoring.providers.application_risk_matrix.technical_severity]
critical = { low = "medium", medium = "high", high = "critical" }
high = { low = "low", medium = "medium", high = "high" }
medium = { low = "low", medium = "low", high = "medium" }
low = { low = "low", medium = "low", high = "low" }

# The impact_class factor (one factor among many, not the whole score) is derived from the run's
# pinned MITRE CWE catalog Common_Consequences under cwe-impact-derivation/1 (decision 11; see
# docs/operations/inference-security-review.md "Tuning scoring"). This table lists only exceptions
# and wins over derivation. A CWE with neither an override nor a mapped catalog consequence (or a
# run without a pinned catalog) leaves technical severity null with impact_class in missing_factors.
# Seeded from the pre-derivation hand table where its class was a deliberate judgement that the
# catalog's worst-case consequence does not express for the target itself.
[jobs.job_inference_security_review.settings.scoring.cwe_impact_overrides]
"CWE-79" = { impact_class = "medium", reason = "script runs in the victim's browser, not on the reviewed target; the catalog's code-execution consequence overstates target impact" }
"CWE-190" = { impact_class = "medium", reason = "a wraparound is a precursor; code execution arises only when the value reaches a memory write, which is scored as its own weakness (CWE-787, CWE-120)" }
"CWE-209" = { impact_class = "low", reason = "error messages disclose diagnostic detail, not bulk application data" }
"CWE-476" = { impact_class = "medium", reason = "the typical consequence is a crash; the catalog's code execution needs rare platform conditions" }
"CWE-502" = { impact_class = "critical", reason = "gadget-chain code execution is the established consequence; the catalog lists it only as varies by context" }
"CWE-601" = { impact_class = "low", reason = "an open redirect aids phishing; it executes nothing on the target and grants no privilege by itself" }

[jobs.job_inference_security_review.settings.poc]
execution_enabled = false
require_target_authorization = true
require_isolation = true
network = "none"
read_only_target = true
allow_host_execution = false
allow_production_services = false
allow_real_credentials = false
allow_privileged_containers = false
allow_docker_socket = false
allow_deploy_sign_publish = false
max_attempts_per_claim = 1
cpu_limit = 1.0
memory_mb = 1024
timeout_seconds = 60
scratch_mb = 256

[[jobs.job_inference_security_review.settings.poc.eligibility_rules]]
provider = "cvss_v4"
field = "technical_severity.rating"
operator = "in"
values = ["HIGH", "CRITICAL"]

[jobs.job_inference_security_review.steps.scope]
workers = 1
[jobs.job_inference_security_review.steps.scope.tasks.accept_manifest]
[jobs.job_inference_security_review.steps.scope.tasks.assemble_scope]

[jobs.job_inference_security_review.steps.triage]
workers = 1
[jobs.job_inference_security_review.steps.triage.tasks.lead_severity]

[jobs.job_inference_security_review.steps.packages]
workers = 2
[jobs.job_inference_security_review.steps.packages.tasks.assemble_lead_packages]
[jobs.job_inference_security_review.steps.packages.tasks.assemble_hunt_packages]

[jobs.job_inference_security_review.steps.lead_review]
workers = 1
[jobs.job_inference_security_review.steps.lead_review.tasks.teams]

[jobs.job_inference_security_review.steps.hunt_review]
workers = 1
[jobs.job_inference_security_review.steps.hunt_review.tasks.teams]

[jobs.job_inference_security_review.steps.merge]
workers = 1
[jobs.job_inference_security_review.steps.merge.tasks.claims]

[jobs.job_inference_security_review.steps.adjudicate]
workers = 1
[jobs.job_inference_security_review.steps.adjudicate.tasks.apply_policy]

[jobs.job_inference_security_review.steps.scoring]
workers = 1
[jobs.job_inference_security_review.steps.scoring.tasks.score_claims]

[jobs.job_inference_security_review.steps.completeness]
workers = 1
[jobs.job_inference_security_review.steps.completeness.tasks.audit]

[jobs.job_inference_security_review.steps.publication]
