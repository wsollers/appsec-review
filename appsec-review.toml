[jobs.job_target_analysis_plan]
name = "target_analysis_plan"
workers = 1

[jobs.job_target_analysis_plan.settings]
summary_max_items = 2000
summary_max_bytes = 524288
summary_sample_per_prefix = 20

[jobs.job_target_analysis_plan.settings.model]
enabled = false
provider = "openai"
model = "gpt-5"
reasoning = "medium"
max_input_tokens = 32000
max_output_tokens = 8000
timeout_seconds = 120
retries = 1

[jobs.job_target_analysis_plan.steps.catalog_summary]
workers = 1
[jobs.job_target_analysis_plan.steps.catalog_summary.tasks.load_accepted_catalog]
[jobs.job_target_analysis_plan.steps.catalog_summary.tasks.summarize_components]

[jobs.job_target_analysis_plan.steps.analysis_decisions]
workers = 1
[jobs.job_target_analysis_plan.steps.analysis_decisions.tasks.apply_deterministic_rules]
[jobs.job_target_analysis_plan.steps.analysis_decisions.tasks.resolve_ambiguity]

[jobs.job_target_analysis_plan.steps.plan_acceptance]
workers = 1
[jobs.job_target_analysis_plan.steps.plan_acceptance.tasks.validate_plan]
[jobs.job_target_analysis_plan.steps.plan_acceptance.tasks.index_plan]
[jobs.job_target_analysis_plan.steps.plan_acceptance.tasks.publish_handoff]

