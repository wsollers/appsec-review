contract_patterns = ["**/*.proto", "**/*.graphql", "**/*.avsc", "**/openapi*.{json,yaml,yml}",
                     "**/swagger*.{json,yaml,yml}"]
min_production_churn_lines = 50

[jobs.job_change_context_analysis.settings.ownership]
