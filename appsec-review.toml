[jobs.job_review_data_indexing]
name = "review_data_indexing"
workers = 1

# Accepted dataset inventory, publication audit, cross-domain links and stage-1 precomputed
# products. Reads only accepted shards, handoffs and hash-verified run-owned artifacts; it never
# parses raw scanner output, IR or a CPG. See docs/architecture/indexing-and-query-reuse.md.
[jobs.job_review_data_indexing.settings]
# Run-tree enumeration bound for the publication audit. Reaching it fails acceptance.
max_run_files = 500000
# Every handoff artifact is rehashed; an unaccounted output or audit violation blocks acceptance.
max_facts_per_product = 200000
max_links_per_rule = 200000
# High/Critical and unknown-severity lead menus are partitioned at this size and never truncated.
menu_partition_size = 20
max_build_exec_events = 20000
max_commands_per_action = 64
feed_max_age_days = 14
# Per-feed freshness bounds that override feed_max_age_days; a pinned snapshot older than its bound
# is pinned as stale and every product joining it records a stale_feed gap.
feed_max_age_days_overrides = { kev = 7, epss = 3 }
# Offline cross-check of this job's published shard text with the pinned tool-sqlite-fts image:
# "disabled", "optional" (record a named gap when the image is unavailable) or "required" (fail).
# The image output is a validation receipt only; MCP reads only accepted in-process shards.
fts_image_validation = "optional"
fts_max_records = 100000
fts_max_input_bytes = 16777216
fts_max_text_bytes = 131072

