[runtime]
runs_dir = "runs"
data_dir = "data"
metadata_dir = "runs/metadata"

[build_capture]
mode = "required"
backend = "ptrace"
event_count_limit = 100000
argv_count_limit = 256
argument_bytes_limit = 16384
capture_envp = true
envp_count_limit = 1024
envp_bytes_limit = 131072
envp_redact_names = [
  "AWS_SECRET_ACCESS_KEY",
  "GITHUB_TOKEN",
  "NODE_AUTH_TOKEN",
  "NUGET_AUTH_TOKEN",
  "PIP_INDEX_URL",
]
path_bytes_limit = 4096
# Post-build file inventory and response-file snapshot bounds (no hashing happens during the build).
file_inventory_count_limit = 1000000
response_file_count_limit = 10000
response_file_bytes_limit = 1048576
tool_call_count_limit = 10000
secret_finding_count_limit = 1000

[tools]
# Global selection policy; disabled coverage is a named gap, never a clean result.
disable_grype = true
# Catalog Swift, but keep it out of execution and downstream evidence unless explicitly enabled.
# Enabling removes only this policy gate; unsupported tool/platform requirements remain gaps.
enable_swift = false

[binary_decompilation]
# Pre-run Ghidra decompilation of third-party binaries (`appsec-review binary-decompile`). It runs
# before a review is submitted, one binary at a time, so its container limits exceed the central
# scanner policy. Network, user, mounts, and capabilities stay at the scanner baseline.
tool_id = "tool-ghidra"
memory = "8g"
cpus = 4
pids_limit = 1024
max_heap = "6g"                     # JVM heap; must leave 1g of `memory` for the native decompiler
timeout_seconds = 7200              # whole container
analysis_timeout_seconds = 3600     # Ghidra auto-analysis; a timeout is a named gap, not a failure
decompile_timeout_seconds = 60      # per function; a timeout is a named gap for that function
max_binary_bytes = 536870912
max_functions = 50000
max_function_bytes = 262144         # pseudo-C per function
max_pcode_ops = 20000               # high P-code operations per function
max_strings = 100000
min_string_length = 4
output_file_bytes = 2147483648      # RLIMIT_FSIZE for every file the container writes

# One table per binary. `sha256` is the expected hash of the file at `path`; a mismatch refuses
# the run. `authorization` states why this binary may be reverse-engineered (license term,
# contract, or ownership) and is recorded in the publication. Optional `processor`,
# `compiler_spec`, and `loader` override Ghidra's detection.
#
# [[binary_decompilation.binaries]]
# id = "vendor-codec"
# path = "inputs/vendor/libcodec.so"
# sha256 = "<64 lowercase hex characters>"
# authorization = "Vendor agreement 2026-014 section 7 permits security analysis"

[orchestration.dagster]
executor = "multiprocess"
max_concurrent = 8

[orchestration.dagster.pools]
scanner = 6
index = 4
lifecycle = 1
cpp_build = 4
cpp_analysis = 6
owasp_validator = 4
owasp_verification = 2
ci_linter = 8
inference_teams = 2              # one per lane unit; model concurrency is set by review_teams
inference_score = 4

