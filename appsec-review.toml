name = "owasp_control_assessment"
workers = 8

[jobs.job_owasp_control_assessment.settings]
asvs_level = 2
masvs_profile = "L2"
max_batch_size = 12
max_components_per_batch = 5
max_components = 128
dynamic_authorized = false

[jobs.job_owasp_control_assessment.settings.model]
