[runtime]
runs_dir = "runs"
data_dir = "data"
metadata_dir = "runs/metadata"

[build_capture]
backend = "ptrace"
event_count_limit = 100000
argv_count_limit = 256
argument_bytes_limit = 16384
capture_envp = true
envp_count_limit = 1024
envp_bytes_limit = 131072
envp_redact_names = [
  "AWS_SECRET_ACCESS_KEY",
  "GITHUB_TOKEN",
  "NODE_AUTH_TOKEN",
  "NUGET_AUTH_TOKEN",
  "PIP_INDEX_URL",
]
path_bytes_limit = 4096
tool_call_count_limit = 10000
tool_stream_bytes_limit = 1048576
secret_finding_count_limit = 1000

[tools]
# Global selection policy; disabled coverage is a named gap, never a clean result.
disable_grype = true

[orchestration.dagster]
executor = "multiprocess"
max_concurrent = 8

[orchestration.dagster.pools]
scanner = 6
index = 4
lifecycle = 1
cpp_build = 4
cpp_analysis = 6
owasp_validator = 4
owasp_verification = 2
ci_linter = 8

[jobs.job_third_party_data_sync]
name = "third_party_data_sync"
workers = 3

[jobs.job_third_party_data_sync.schedule]
enabled = true
cron = "0 0 * * *"
timezone = "UTC"

[jobs.job_third_party_data_sync.steps.nvd_sync]
workers = 1

[jobs.job_third_party_data_sync.steps.nvd_sync.settings]
feed_root = "data/feeds/nvd"
api_key_env = "NVD_API_KEY"
first_year = 2002
page_size = 2000
max_window_days = 119
request_delay_with_key_seconds = 0.6
request_delay_without_key_seconds = 6.0
max_download_bytes = 536870912
max_api_response_bytes = 67108864

[jobs.job_third_party_data_sync.steps.nvd_sync.tasks.fetch]
workers = 1

[jobs.job_third_party_data_sync.steps.nvd_sync.tasks.process]
workers = 1

[jobs.job_third_party_data_sync.steps.nvd_sync.tasks.publish]
workers = 1

