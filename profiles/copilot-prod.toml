[jobs.job_inference_security_review.settings.models.triage]
provider = "copilot-sdk"
model = "claude-sonnet-5.5"
reasoning = "medium"
max_input_tokens = 64000
max_output_tokens = 16000
max_queries = 0
max_turns = 1
