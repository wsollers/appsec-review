# Opt-in Copilot production profile. Limits, reasoning and role bindings mirror prod.toml.
# Only provider and exact catalog model IDs differ; tests enforce parity with prod.
[jobs.job_target_analysis_plan.settings.model]
provider = "copilot-sdk"
model = "claude-sonnet-5.5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 64000
timeout_seconds = 900

[jobs.job_post_build_security_assessment.settings.model]
provider = "copilot-sdk"
model = "claude-sonnet-5.5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 32000
timeout_seconds = 600

[jobs.job_dependency_intelligence.settings.model]
provider = "copilot-sdk"
model = "claude-sonnet-5.5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 32000
timeout_seconds = 600

[jobs.job_owasp_control_assessment.settings.model]
provider = "copilot-sdk"
model = "claude-sonnet-5.5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 32000
timeout_seconds = 600

[jobs.job_owasp_control_assessment.settings.models.reviewer]
provider = "copilot-sdk"
model = "claude-opus-5.5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 32000
