[jobs.job_inference_security_review.settings.models.strong]
provider = "copilot-sdk"
model = "claude-opus-5.5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 64000
max_queries = 60
max_turns = 16
timeout_seconds = 2400

[jobs.job_inference_security_review.settings.roles.independent_verifier]
model_profile = "strong"

[jobs.job_inference_security_review.settings.roles.adjudication_judge]
model_profile = "strong"

[jobs.job_inference_security_review.settings.lanes]
exploration_enabled = true
exploration_reserve = 1

[jobs.job_poc_generation.settings.models.default]
provider = "copilot-sdk"
model = "claude-sonnet-5.5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 32000
max_queries = 8
max_turns = 6
timeout_seconds = 600

[jobs.job_inference_security_review.settings.budgets]
budget_team_packages = "all"
max_model_turns = 60000
max_input_tokens = 600000000
max_output_tokens = 60000000
max_retrieval_queries = 200000
timeout_seconds = 86400
