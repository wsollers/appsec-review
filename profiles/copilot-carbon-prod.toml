# Opt-in Copilot production profile targeting Gemini 4 Carbon (gemini-4-carbon) at "high" reasoning
# across every model-calling job and inference role.
#
# Selected on request (APPSEC_REVIEW_PROFILE=copilot-carbon-prod, load_config(profile="copilot-carbon-prod"),
# scripts --profile copilot-carbon-prod); host concurrency and resource budgets stay in a separate
# capacity overlay under test/acceptance/ (for example WSOLLERS1-capacity-overlay.toml).
#
# Catalog bounds for gemini-4-carbon: 936k prompt tokens, 64k output tokens, 1M context window,
# supported reasoning efforts = ["low", "medium", "high"]. Output caps keep >=32k tokens on short
# calls so high-reasoning thinking tokens do not starve structured JSON output.
#
# Single-model verification note (T-5055): because all roles use gemini-4-carbon,
# verification.require_distinct_model_for_ship_blocking records a single-model warning, labels
# confirmed ship-blocking findings ship_blocking_pending_distinct_verification, and skips the
# chain weakest-link verifier until a distinct verifier model is configured.

[jobs.job_target_analysis_plan.settings.model]
provider = "copilot-sdk"
model = "gemini-4-carbon"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 64000
timeout_seconds = 900

