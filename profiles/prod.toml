# Runtime profile "prod": more capable models and generous token limits for real review runs.
#
# Selected only on request (APPSEC_REVIEW_PROFILE=prod, load_config(profile="prod"), scripts
# --profile prod); the default profile "dev" is appsec-review.toml exactly as it is. This file is a
# closed-allowlist layer deep-merged over appsec-review.toml before validation (see
# docs/operations/model-profiles.md): it may set only the model tables of the model-calling jobs, the
# inference review's model profiles, role bindings, budgets, exploration, team count and active-claim cap. Edit model names
# here when an account's model list differs, then rerun; the file hash is part of the run.

[jobs.job_target_analysis_plan.settings.model]
model = "claude-sonnet-5-5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 64000
timeout_seconds = 900

[jobs.job_post_build_security_assessment.settings.model]
model = "claude-sonnet-5-5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 32000
timeout_seconds = 600

[jobs.job_dependency_intelligence.settings.model]
model = "claude-sonnet-5-5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 32000
timeout_seconds = 600

[jobs.job_owasp_control_assessment.settings.model]
model = "claude-sonnet-5-5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 32000
timeout_seconds = 600

[jobs.job_owasp_control_assessment.settings.models.reviewer]
provider = "claude-cli"
model = "claude-opus-5-5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 32000
timeout_seconds = 600

[jobs.job_project_build.settings.model]
model = "claude-sonnet-5-5"
reasoning = "medium"
max_input_tokens = 128000
max_output_tokens = 16000
timeout_seconds = 600

[jobs.job_inference_security_review.settings.models.default]
model = "claude-sonnet-5-5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 64000
max_queries = 60
max_turns = 16
timeout_seconds = 1800

# Lead severity triage stays short and tool-free but follows the explicitly selected prod model tier.
[jobs.job_inference_security_review.settings.models.triage]
model = "claude-sonnet-5-5"
reasoning = "medium"
max_input_tokens = 64000
max_output_tokens = 16000
max_queries = 0
max_turns = 1
timeout_seconds = 600

# The independent verifier uses a different model from every red cell, which is what
# verification.require_distinct_model_for_ship_blocking checks. The adjudication judge uses "strong" as well,
# so it differs from the red cells' model too.
[jobs.job_inference_security_review.settings.models.strong]
provider = "claude-cli"
model = "claude-opus-5-5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 64000
max_queries = 60
max_turns = 16
timeout_seconds = 2400

[jobs.job_inference_security_review.settings.roles.independent_verifier]
model_profile = "strong"

[jobs.job_inference_security_review.settings.roles.adjudication_judge]
model_profile = "strong"

[jobs.job_inference_security_review.settings.lanes]
# Reserve stays inside the existing package/claim/usage limits; dev remains opt-in.
exploration_enabled = true
exploration_reserve = 20

[jobs.job_inference_security_review.settings.teams]
review_teams = 7

[jobs.job_inference_security_review.settings.rounds]
max_active_claims = 1000

[jobs.job_poc_generation.settings.models.default]
model = "claude-sonnet-5-5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 32000
max_queries = 8
max_turns = 6
timeout_seconds = 600

[jobs.job_remediation_planning.settings.writer]
model = "claude-sonnet-5-5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 32000
max_turns = 6
max_queries = 4
timeout_seconds = 900

[jobs.job_remediation_validation.settings.reviewer]
model = "claude-sonnet-5-5"
reasoning = "high"
max_input_tokens = 200000
max_output_tokens = 16000
max_turns = 2
max_queries = 0
timeout_seconds = 900

[jobs.job_inference_security_review.settings.budgets]
budget_team_packages = "all"
max_model_turns = 60000
max_input_tokens = 600000000
max_output_tokens = 60000000
max_retrieval_queries = 200000
timeout_seconds = 86400
