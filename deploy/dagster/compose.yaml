name: ${APPSEC_COMPOSE_PROJECT:?Run deploy/dagster/bin/bootstrap.py first}

x-dagster-environment: &dagster-environment
  DAGSTER_HOME: /opt/dagster/home
  DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:?Run deploy/dagster/bin/bootstrap.py first}
  APPSEC_REVIEW_CONFIG: /opt/app/appsec-review.toml
  APPSEC_REVIEW_TARGET: ${APPSEC_REVIEW_TARGET:-/opt/app/targets/appsec-multi-vuln}
  # A configured [[target_acquisition.systems]] id that target_acquisition acquires into targets/<id>/
  # before intake; APPSEC_REVIEW_TARGET must then be /opt/app/targets/<id>. Empty reviews the target as is.
  APPSEC_REVIEW_SYSTEM: ${APPSEC_REVIEW_SYSTEM:-}
  # "record" during a stepwise parity walk (docs/processes/local-dagster-parity.md); empty otherwise.
  APPSEC_REVIEW_MODEL_RECORDING: ${APPSEC_REVIEW_MODEL_RECORDING:-}
  # A capacity overlay under /opt/app/test/acceptance (docs/operations/inference-security-review.md); empty otherwise.
  APPSEC_REVIEW_CONFIG_OVERLAY: ${APPSEC_REVIEW_CONFIG_OVERLAY:-}
  # Runtime profile: dev (default), prod, or copilot-dev (docs/operations/model-profiles.md).
  APPSEC_REVIEW_PROFILE: ${APPSEC_REVIEW_PROFILE:-dev}
  # The implementation-release manifest the code-location start measures from the mounted checkout
  # (docs/architecture/deployment-image-and-source-mount.md); every service reads this one copy.
  APPSEC_REVIEW_RELEASE_MANIFEST: /var/dagster/release/implementation-release.json
  # The tooling image's identity, recorded separately from the source identity in every attempt's
  # deployment_identity (runtime/repair.py); it is the same verified ID the services launch.
  APPSEC_REVIEW_IMAGE_ID: ${APPSEC_REVIEW_DAGSTER_IMAGE:?APPSEC_REVIEW_DAGSTER_IMAGE must be a host-verified sha256 image id; start through deploy/dagster/bin/ops.py}
  # Signed-module enforcement over the mounted sources. lifecycle.py sets both for the launch: on
  # (the default) after signing the checkout, or off when deploy/dagster/.env carries
  # APPSEC_UNSIGNED_MODULES=1 on a development host. The `-` form passes an empty value through.
  APPSEC_REVIEW_REQUIRE_SIGNED_MODULES: ${APPSEC_SIGNED_MODULES:-1}
  APPSEC_REVIEW_MODULE_SIGNATURE: ${APPSEC_MODULE_SIGNATURE-/opt/appsec-review/signing/python-modules.json}

x-dagster-service: &dagster-service
  # The exact image ID that lifecycle.py start/reload verified on this host against the trusted keys;
  # never a mutable tag, never a default, and never an implicit build or pull. Every service that uses
  # this image must keep this form (host.IMAGE_SERVICES; tests/test_dagster_signing.py enforces it).
  image: ${APPSEC_REVIEW_DAGSTER_IMAGE:?APPSEC_REVIEW_DAGSTER_IMAGE must be a host-verified sha256 image id; start through deploy/dagster/bin/ops.py}
  pull_policy: never
  user: "${APPSEC_UID:-0}:${APPSEC_GID:-0}"
  cgroup_parent: appsecreview-services.slice
  environment: *dagster-environment
  volumes:
    - dagster-storage:/var/dagster
    # Application sources and assets: the image is tooling only, so the checkout's release closure
    # (release-dependencies.json) is mounted read-only. Editing code on the host and running
    # `lifecycle.py reload` is the whole deployment cycle; no image build is involved.
    - ../../src:/opt/app/src:ro
    - ../../pyproject.toml:/opt/app/pyproject.toml:ro
    - ../../appsec-review.toml:/opt/app/appsec-review.toml:ro
    - type: bind
      source: ${APPSEC_REVIEW_HOST_PINS:-./host-pins.toml}
      target: /opt/app/deploy/dagster/host-pins.toml
      read_only: true
      bind:
        create_host_path: false
    - ../../release-dependencies.json:/opt/app/release-dependencies.json:ro
    - ../../profiles:/opt/app/profiles:ro
    - ../../docs/schemas:/opt/app/docs/schemas:ro
    - ../../containers:/opt/app/containers:ro
    - ../../pipeline:/opt/app/pipeline:ro
    - ../../scripts:/opt/app/scripts:ro
    - ../../tools/cve-bin-tool:/opt/app/tools/cve-bin-tool:ro
    - ../../deploy/dagster/Dockerfile:/opt/app/deploy/dagster/Dockerfile:ro
    - ../../deploy/dagster/requirements.txt:/opt/app/deploy/dagster/requirements.txt:ro
    - ../../deploy/dagster/requirements.lock.txt:/opt/app/deploy/dagster/requirements.lock.txt:ro
    - ../../deploy/dagster/requirements.copilot.txt:/opt/app/deploy/dagster/requirements.copilot.txt:ro
    # Module envelope signed by lifecycle.py at launch (directory, so an unsigned development launch
    # mounts an empty directory instead of failing on a missing file).
    - ../../deploy/dagster/signing:/opt/appsec-review/signing:ro
    - ../../runs:/opt/app/runs
    - ../../data:/opt/app/data
    # Writable: acquisition creates checkouts here and builds write their outputs into the checkout.
    - ../../targets:/opt/app/targets
    - ../../rules:/opt/app/rules:ro
    - ../../test/acceptance:/opt/app/test/acceptance:ro
    # Signing trust anchors and image envelopes, read-only; they must already exist on the host.
    - type: bind
      source: ${APPSEC_SIGNING_TRUSTED_KEYS_DIR:-/etc/appsec-review/signing/trusted-keys}
      target: /etc/appsec-review/signing/trusted-keys
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${APPSEC_SIGNING_IMAGE_SIGNATURES_DIR:-/var/lib/appsec-review/signing/images}
      target: /var/lib/appsec-review/signing/images
      read_only: true
      bind:
        create_host_path: false
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    cgroup_parent: appsecreview-services.slice
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 1024
    environment:
      POSTGRES_USER: appsec
      POSTGRES_DB: appsec_dagster
      POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:?Run deploy/dagster/bin/bootstrap.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appsec -d appsec_dagster"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Inference result cache (Microsoft Garnet, Redis-compatible): TTL-bounded pointers to completed
  # blue-role cell results. Optional and fail-open: reviews run uncached if it is down. Internal
  # network only; the password reaches Garnet through a config file, never the command line.
  result-cache:
    image: ghcr.io/microsoft/garnet:2.2.5@sha256:ef84a729cc054b048d8ed17113475890dc6389a8ea8725c34771efe785841137
    cgroup_parent: appsecreview-services.slice
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    command:
      - --config-import-path
      - /run/appsec-result-cache/garnet.conf
      - --port
      - "6379"
      # In-memory only (no storage tier): the oldest entries are evicted beyond this log budget.
      - --memory
      - 128m
      - --index
      - 16m
      - --page
      - 4m
      - --segment
      - 32m
    configs:
      - source: result-cache-config
        target: /run/appsec-result-cache/garnet.conf
        mode: 0444
    # Garnet has no CLI client; bash's /dev/tcp sends an unauthenticated PING, and -NOAUTH proves the
    # server is up and enforcing authentication without putting the password in the check.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6379 && printf 'PING\\r\\n' >&3 && read -t 2 r <&3 && [[ $$r == +PONG* || $$r == -NOAUTH* ]]"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  code-location:
    <<: *dagster-service
    cpus: 4
    mem_limit: 5g
    memswap_limit: 5g
    pids_limit: 2048
    group_add:
      - "${APPSEC_DOCKER_GID:-0}"
    # The in-container gate (appsec_review.signing.container_self_check) requires this container's own
    # image to be exactly the launched ID and to verify against the mounted trust anchors, then hands
    # off to the launch step (appsec_review.runtime.release), which verifies the mounted runtime assets,
    # measures the implementation-release manifest from the mounted checkout onto /var/dagster/release
    # and only then execs the code server; on refusal the code location never becomes healthy
    # (host.SELF_CHECK_COMMAND, host.LAUNCH_COMMAND).
    command:
      - python
      - -m
      - appsec_review.signing.container_self_check
      - --
      - python
      - -m
      - appsec_review.runtime.release
      - --root
      - /opt/app
      - --verify-assets
      - --exec
      - dagster
      - code-server
      - start
      - --host
      - 0.0.0.0
      - --port
      - "4000"
      - --module-name
      - appsec_review.orchestration.dagster.definitions
      - --location-name
      - appsec_review
    environment:
      <<: *dagster-environment
      APPSEC_REVIEW_DAGSTER_IMAGE: ${APPSEC_REVIEW_DAGSTER_IMAGE:?APPSEC_REVIEW_DAGSTER_IMAGE must be a host-verified sha256 image id; start through deploy/dagster/bin/ops.py}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Source-history GitHub enrichment only. lifecycle.py fills it from the creating shell's `gh`
      # login when unset; never stored in .env, and model workers never see it.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Result-cache AUTH secret; runs execute in code-location subprocesses, so only this service needs it.
      APPSEC_RESULT_CACHE_PASSWORD: ${APPSEC_RESULT_CACHE_PASSWORD:?Run deploy/dagster/bin/bootstrap.py first}
      HOME: /tmp
    depends_on:
      postgres:
        condition: service_healthy
      # Ordering only: a missing or unhealthy cache never blocks the code location (fail-open).
      result-cache:
        condition: service_started
        required: false
    # YAML merge keys do not merge lists, so this service repeats the anchor's mounts and adds the
    # Docker socket; keep the two lists aligned (tests/test_dagster_signing.py checks the closure).
    volumes:
      - dagster-storage:/var/dagster
      - ../../src:/opt/app/src:ro
      - ../../pyproject.toml:/opt/app/pyproject.toml:ro
      - ../../appsec-review.toml:/opt/app/appsec-review.toml:ro
      - type: bind
        source: ${APPSEC_REVIEW_HOST_PINS:-./host-pins.toml}
        target: /opt/app/deploy/dagster/host-pins.toml
        read_only: true
        bind:
          create_host_path: false
      - ../../release-dependencies.json:/opt/app/release-dependencies.json:ro
      - ../../profiles:/opt/app/profiles:ro
      - ../../docs/schemas:/opt/app/docs/schemas:ro
      - ../../containers:/opt/app/containers:ro
      - ../../pipeline:/opt/app/pipeline:ro
      - ../../scripts:/opt/app/scripts:ro
      - ../../tools/cve-bin-tool:/opt/app/tools/cve-bin-tool:ro
      - ../../deploy/dagster/Dockerfile:/opt/app/deploy/dagster/Dockerfile:ro
      - ../../deploy/dagster/requirements.txt:/opt/app/deploy/dagster/requirements.txt:ro
      - ../../deploy/dagster/requirements.lock.txt:/opt/app/deploy/dagster/requirements.lock.txt:ro
      - ../../deploy/dagster/requirements.copilot.txt:/opt/app/deploy/dagster/requirements.copilot.txt:ro
      - ../../deploy/dagster/signing:/opt/appsec-review/signing:ro
      - ../../runs:/opt/app/runs
      - ../../data:/opt/app/data
      - ../../targets:/opt/app/targets
      - ../../rules:/opt/app/rules:ro
      - ../../test/acceptance:/opt/app/test/acceptance:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${APPSEC_SIGNING_TRUSTED_KEYS_DIR:-/etc/appsec-review/signing/trusted-keys}
        target: /etc/appsec-review/signing/trusted-keys
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${APPSEC_SIGNING_IMAGE_SIGNATURES_DIR:-/var/lib/appsec-review/signing/images}
        target: /var/lib/appsec-review/signing/images
        read_only: true
        bind:
          create_host_path: false
    # Each check starts a Python process that imports dagster (~10-13s of CPU on a loaded host), so
    # the timeout must exceed that import and the interval must leave the CPU idle between checks.
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-h", "127.0.0.1", "-p", "4000"]
      interval: 30s
      timeout: 60s
      retries: 10
      start_period: 60s
      start_interval: 5s

  webserver:
    <<: *dagster-service
    cpus: 0.5
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 512
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/home/workspace.yaml"]
    ports:
      - "127.0.0.1:${APPSEC_DAGSTER_WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      code-location:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=5).read()"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  daemon:
    <<: *dagster-service
    cpus: 0.5
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 512
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/home/workspace.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      code-location:
        condition: service_healthy
    # liveness-check imports dagster too; same budget as the code location.
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 60s
      retries: 10
      start_period: 60s
      start_interval: 5s

configs:
  result-cache-config:
    content: '{"AuthenticationMode":"Password","Password":"${APPSEC_RESULT_CACHE_PASSWORD:?Run deploy/dagster/bin/bootstrap.py first}"}'

volumes:
  postgres-data:
  dagster-storage:
