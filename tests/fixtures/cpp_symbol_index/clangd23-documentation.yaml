Signature:       '(const char *src, char *dst, int *srcSizePtr, int targetDstSize)'
TemplateSpecializationArgs: ''
CompletionSnippetSuffix: '(${1:const char *src}, ${2:char *dst}, ${3:int *srcSizePtr}, ${4:int targetDstSize})'
Documentation:   "LZ4_compress_destSize() :\nReverse the logic : compresses as much data as possible from 'src' buffer\ninto already allocated buffer 'dst', of size >= 'targetDestSize'.\nThis function either compresses the entire 'src' content into 'dst' if it's large enough,\nor fill 'dst' buffer completely with as much data as possible from 'src'.\nnote: acceleration parameter is fixed to \"default\".\n\n*srcSizePtr : will be modified to indicate how many bytes where read from 'src' to fill 'dst'.\n             New value is necessarily <= input value.\n@return : Nb bytes written into 'dst' (necessarily <= targetDestSize)\n         or 0 if compression fails."
ReturnType:      int
Type:            'c:I'
...
