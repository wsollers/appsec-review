apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: customer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: application
      securityContext:
        runAsUser: 1000
      containers:
        - name: http
          image: nginx:1.27.2
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: customer
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: web
      port: 80
      targetPort: web
