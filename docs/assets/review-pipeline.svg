<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" width="1500" height="760" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How an appsec-review run works</title>
  <desc id="d">A repository is cloned at an exact commit into the target checkout, then six stages run: acquire, understand and build, analyze with tools, index the evidence, AI review, and report. Every stage writes immutable receipts under the run directory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24405f"/>
      <stop offset="1" stop-color="#1a2f47"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a2f47" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a9d8f"/>
    </marker>
  </defs>

  <rect width="1500" height="760" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="58" font-size="30" font-weight="700" fill="#1a2f47">How an appsec-review run works</text>
  <text x="60" y="88" font-size="16" fill="#5b6b7f">One repository in, one evidence-backed security report out. Nothing is claimed that a source line or a tool result does not show.</text>

  <!-- Source repository -->
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="200" height="118" rx="14" fill="#ffffff" stroke="#d5dce6"/>
  </g>
  <g transform="translate(80,170)">
    <circle cx="14" cy="14" r="14" fill="#e9eef5"/>
    <path d="M14 5a9 9 0 0 0-2.8 17.5c.4.1.6-.2.6-.4v-1.7c-2.5.5-3-1.1-3-1.1-.4-1-1-1.3-1-1.3-.8-.6.1-.6.1-.6.9.1 1.4 1 1.4 1 .8 1.4 2.1 1 2.6.8.1-.6.3-1 .6-1.2-2-.2-4.1-1-4.1-4.4 0-1 .4-1.8.9-2.4-.1-.2-.4-1.1.1-2.4 0 0 .8-.2 2.5.9a8.6 8.6 0 0 1 4.5 0c1.7-1.1 2.5-.9 2.5-.9.5 1.3.2 2.2.1 2.4.6.6.9 1.4.9 2.4 0 3.4-2.1 4.2-4.1 4.4.3.3.6.8.6 1.6v2.4c0 .2.2.5.6.4A9 9 0 0 0 14 5z" fill="#1a2f47"/>
    <text x="40" y="19" font-size="15" font-weight="700" fill="#1a2f47">Your repository</text>
  </g>
  <text x="80" y="222" font-size="13" fill="#5b6b7f">Any Git repository and an exact</text>
  <text x="80" y="240" font-size="13" fill="#5b6b7f">commit to review.</text>

  <!-- Clone arrow -->
  <line x1="260" y1="209" x2="328" y2="209" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="294" y="196" font-size="11" fill="#5b6b7f" text-anchor="middle">clone</text>

  <!-- Target checkout -->
  <g filter="url(#shadow)">
    <rect x="336" y="150" width="200" height="118" rx="14" fill="#ffffff" stroke="#d5dce6"/>
  </g>
  <g transform="translate(356,170)">
    <rect x="0" y="4" width="28" height="22" rx="4" fill="#e9eef5"/>
    <path d="M0 9h28" stroke="#1a2f47" stroke-width="2"/>
    <text x="40" y="19" font-size="15" font-weight="700" fill="#1a2f47">Target checkout</text>
  </g>
  <text x="356" y="222" font-size="13" fill="#5b6b7f">A local copy whose every file is</text>
  <text x="356" y="240" font-size="13" fill="#5b6b7f">hashed; nothing is read from the</text>
  <text x="356" y="258" font-size="13" fill="#5b6b7f">network again.</text>

  <!-- Arrow into the pipeline -->
  <path d="M436 268 L436 322" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Trust badges -->
  <g transform="translate(600,150)">
    <rect x="0" y="0" width="840" height="118" rx="14" fill="url(#navy)"/>
    <text x="28" y="36" font-size="15" font-weight="700" fill="#ffffff">What makes the result trustworthy</text>
    <g font-size="13" fill="#dce6f2">
      <text x="28" y="66">•  Every tool runs in a pinned, signed container with no network access.</text>
      <text x="28" y="88">•  Every finding cites the exact source lines and the tool output that support it.</text>
      <text x="28" y="110">•  Anything not checked is reported as a named gap, never as a clean result.</text>
    </g>
    <g transform="translate(560,30)" font-size="12" fill="#c8d6e6">
      <text x="0" y="0">Inputs are data, never</text>
      <text x="0" y="18">instructions: the target's own</text>
      <text x="0" y="36">scripts and documents cannot</text>
      <text x="0" y="54">steer the review.</text>
    </g>
  </g>

  <!-- Stage cards -->
  <g id="stages" transform="translate(60,330)">
    <!-- 1 Acquire -->
    <g>
      <g filter="url(#shadow)"><rect x="0" y="0" width="215" height="250" rx="14" fill="#ffffff" stroke="#d5dce6"/></g>
      <rect x="0" y="0" width="215" height="54" rx="14" fill="#24405f"/>
      <rect x="0" y="40" width="215" height="14" fill="#24405f"/>
      <text x="18" y="34" font-size="17" font-weight="700" fill="#ffffff">1  Acquire</text>
      <g font-size="13" fill="#2f3f52">
        <text x="18" y="84">Pin the commit, snapshot</text>
        <text x="18" y="102">every file with its hash,</text>
        <text x="18" y="120">verify the images the run</text>
        <text x="18" y="138">will use.</text>
      </g>
      <g font-size="12" fill="#5b6b7f">
        <text x="18" y="194" font-weight="700" fill="#2a9d8f">You get</text>
        <text x="18" y="212">An immutable record of</text>
        <text x="18" y="228">exactly what was reviewed.</text>
      </g>
    </g>
    <line x1="215" y1="125" x2="243" y2="125" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 2 Understand and build -->
    <g transform="translate(245,0)">
      <g filter="url(#shadow)"><rect x="0" y="0" width="215" height="250" rx="14" fill="#ffffff" stroke="#d5dce6"/></g>
      <rect x="0" y="0" width="215" height="54" rx="14" fill="#2f5a84"/>
      <rect x="0" y="40" width="215" height="14" fill="#2f5a84"/>
      <text x="18" y="34" font-size="17" font-weight="700" fill="#ffffff">2  Understand, build</text>
      <g font-size="13" fill="#2f3f52">
        <text x="18" y="84">Catalog languages, parts</text>
        <text x="18" y="102">and build systems; plan the</text>
        <text x="18" y="120">analysis; build in pinned</text>
        <text x="18" y="138">containers, tracing the</text>
        <text x="18" y="156">compiler as it runs.</text>
      </g>
      <g font-size="12" fill="#5b6b7f">
        <text x="18" y="194" font-weight="700" fill="#2a9d8f">You get</text>
        <text x="18" y="212">A map of the code and a</text>
        <text x="18" y="228">reproducible build.</text>
      </g>
    </g>
    <line x1="460" y1="125" x2="488" y2="125" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 3 Analyze -->
    <g transform="translate(490,0)">
      <g filter="url(#shadow)"><rect x="0" y="0" width="215" height="250" rx="14" fill="#ffffff" stroke="#d5dce6"/></g>
      <rect x="0" y="0" width="215" height="54" rx="14" fill="#2a9d8f"/>
      <rect x="0" y="40" width="215" height="14" fill="#2a9d8f"/>
      <text x="18" y="34" font-size="17" font-weight="700" fill="#ffffff">3  Analyze</text>
      <g font-size="13" fill="#2f3f52">
        <text x="18" y="84">Run the tools on the built</text>
        <text x="18" y="102">code: CodeQL and compiler</text>
        <text x="18" y="120">analysis, scanners, software</text>
        <text x="18" y="138">bill of materials and known</text>
        <text x="18" y="156">advisories, history, binaries.</text>
      </g>
      <g font-size="12" fill="#5b6b7f">
        <text x="18" y="194" font-weight="700" fill="#2a9d8f">You get</text>
        <text x="18" y="212">Raw facts and leads, each</text>
        <text x="18" y="228">tied to a file and line.</text>
      </g>
    </g>
    <line x1="705" y1="125" x2="733" y2="125" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 4 Index -->
    <g transform="translate(735,0)">
      <g filter="url(#shadow)"><rect x="0" y="0" width="215" height="250" rx="14" fill="#ffffff" stroke="#d5dce6"/></g>
      <rect x="0" y="0" width="215" height="54" rx="14" fill="#3a8f86"/>
      <rect x="0" y="40" width="215" height="14" fill="#3a8f86"/>
      <text x="18" y="34" font-size="17" font-weight="700" fill="#ffffff">4  Index evidence</text>
      <g font-size="13" fill="#2f3f52">
        <text x="18" y="84">Normalize every result into</text>
        <text x="18" y="102">evidence with exact locations;</text>
        <text x="18" y="120">link calls, data flows and</text>
        <text x="18" y="138">advisories; expose it all</text>
        <text x="18" y="156">through typed queries.</text>
      </g>
      <g font-size="12" fill="#5b6b7f">
        <text x="18" y="194" font-weight="700" fill="#2a9d8f">You get</text>
        <text x="18" y="212">One searchable body of</text>
        <text x="18" y="228">evidence, with coverage.</text>
      </g>
    </g>
    <line x1="950" y1="125" x2="978" y2="125" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 5 Review -->
    <g transform="translate(980,0)">
      <g filter="url(#shadow)"><rect x="0" y="0" width="215" height="250" rx="14" fill="#ffffff" stroke="#d5dce6"/></g>
      <rect x="0" y="0" width="215" height="54" rx="14" fill="#c98a1b"/>
      <rect x="0" y="40" width="215" height="14" fill="#c98a1b"/>
      <text x="18" y="34" font-size="17" font-weight="700" fill="#ffffff">5  AI review</text>
      <g font-size="13" fill="#2f3f52">
        <text x="18" y="84">Reviewers with assigned roles</text>
        <text x="18" y="102">and viewpoints read the</text>
        <text x="18" y="120">evidence, test each hypothesis</text>
        <text x="18" y="138">against source and tool facts,</text>
        <text x="18" y="156">then score and triage.</text>
      </g>
      <g font-size="12" fill="#5b6b7f">
        <text x="18" y="194" font-weight="700" fill="#2a9d8f">You get</text>
        <text x="18" y="212">Findings that survived</text>
        <text x="18" y="228">verification, ranked.</text>
      </g>
    </g>
    <line x1="1195" y1="125" x2="1223" y2="125" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 6 Report -->
    <g transform="translate(1225,0)">
      <g filter="url(#shadow)"><rect x="0" y="0" width="155" height="250" rx="14" fill="#ffffff" stroke="#d5dce6"/></g>
      <rect x="0" y="0" width="155" height="54" rx="14" fill="#9a3b3b"/>
      <rect x="0" y="40" width="155" height="14" fill="#9a3b3b"/>
      <text x="18" y="34" font-size="17" font-weight="700" fill="#ffffff">6  Report</text>
      <g font-size="13" fill="#2f3f52">
        <text x="18" y="84">Findings with their</text>
        <text x="18" y="102">evidence chains,</text>
        <text x="18" y="120">remediation plans,</text>
        <text x="18" y="138">coverage and gaps.</text>
      </g>
      <g font-size="12" fill="#5b6b7f">
        <text x="18" y="194" font-weight="700" fill="#2a9d8f">You get</text>
        <text x="18" y="212">A report you can</text>
        <text x="18" y="228">check line by line.</text>
      </g>
    </g>
  </g>

  <!-- Evidence record bar -->
  <g transform="translate(60,610)">
    <rect x="0" y="0" width="1380" height="70" rx="12" fill="#e9eef5" stroke="#cfd8e3"/>
    <g font-size="13" fill="#1a2f47">
      <text x="24" y="30" font-weight="700">Immutable run record</text>
      <text x="24" y="52" fill="#3f4f63">Every stage writes its receipts, resolved configuration and named gaps under runs/&lt;run-id&gt;/. A later run starts from the same record, and nothing in it is rewritten.</text>
    </g>
  </g>
  <!-- ticks from stages into the record -->
  <g stroke="#2a9d8f" stroke-width="2" fill="none">
    <path d="M167 580 L167 608" marker-end="url(#arrowTeal)"/>
    <path d="M412 580 L412 608" marker-end="url(#arrowTeal)"/>
    <path d="M657 580 L657 608" marker-end="url(#arrowTeal)"/>
    <path d="M902 580 L902 608" marker-end="url(#arrowTeal)"/>
    <path d="M1147 580 L1147 608" marker-end="url(#arrowTeal)"/>
    <path d="M1362 580 L1362 608" marker-end="url(#arrowTeal)"/>
  </g>

  <text x="60" y="728" font-size="12" fill="#7a8899">Legend: dark blue, acquisition and understanding · teal, analysis and evidence · amber, model review · red, publication. The record bar receives output from every stage.</text>
</svg>
