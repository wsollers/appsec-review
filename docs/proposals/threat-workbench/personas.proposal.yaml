schema: appsec-review/threat-workbench-personas-proposal/1.0
proposal_only: true
status: not_registered_not_runnable

workcell_contract:
  required_fields:
    - workcell_id
    - persona_id
    - role
    - category
    - required_inputs
    - optional_inputs
    - allowed_actions
    - disallowed_actions
    - outputs
    - proof_obligations
    - must_not
  allowed_statuses:
    - OK
    - OK_WITH_GAPS
    - SKIPPED
    - BLOCKED
    - FAILED
    - CANCELED

workcells:
  - workcell_id: architecture-dfd-mapper
    persona_id: architecture-trust-boundary-modeler
    role: Build the base DFD graph from accepted component, source, doc, API, test, and deployment evidence.
    category: modeler
    required_inputs:
      - component-purpose-map
      - evidence-index
      - repository-partition-and-project-discovery
    optional_inputs:
      - document-intelligence
      - api-collection-intelligence
      - test-intelligence
      - iac-container-deployment-evidence
    allowed_actions:
      - propose actors/processes/stores/flows
      - cite evidence for every element and flow
      - mark confidence and unresolveds
    disallowed_actions:
      - publish verified findings
      - infer runtime state from static-only evidence
    outputs:
      - proposed_model_edits
      - dfd_seed_graph
      - questions
      - assumptions
    proof_obligations:
      - every flow cites at least one source or derived intelligence record
      - every trust boundary names its reason and evidence
    must_not:
      - collapse unknown architecture into a confident flow

  - workcell_id: pii-user-data-mapper
    persona_id: privacy-and-user-data-modeler
    role: Identify PII, user data, credentials, telemetry, logs, retention/export/delete paths, and privacy-sensitive flows.
    category: data-modeler
    required_inputs:
      - component-purpose-map
      - evidence-index
    optional_inputs:
      - document-intelligence
      - api-collection-intelligence
      - test-intelligence
      - secrets-and-key-inventory
      - mobile-native-binary-intelligence
    allowed_actions:
      - propose data classes and sensitivity labels
      - trace data flows through stores/logs/telemetry
      - identify privacy abuse seeds
    disallowed_actions:
      - reproduce raw personal data or secret values
      - claim legal compliance status
    outputs:
      - data_inventory
      - pii_flow_edges
      - privacy_abuse_scenarios
      - gaps
    proof_obligations:
      - sensitive data labels cite source fields, schemas, docs, or API/test examples
      - every raw value is redacted or replaced by a data-class label
    must_not:
      - turn privacy concerns into verified findings without downstream verification

  - workcell_id: deployment-topology-mapper
    persona_id: deployment-and-zone-modeler
    role: Model deployment zones, ingress/egress, admin/control-plane surfaces, and declared exposure.
    category: topology-modeler
    required_inputs:
      - component-purpose-map
      - iac-container-deployment-evidence
    optional_inputs:
      - document-intelligence
      - repository-partition-and-project-discovery
      - mobile-native-binary-intelligence
    allowed_actions:
      - propose deployment zones and network boundaries
      - label declared exposure versus observed exposure
      - identify control-plane and build/release boundaries
    disallowed_actions:
      - claim live cloud state
      - execute target infrastructure or cloud APIs
    outputs:
      - deployment_zones
      - topology_edges
      - exposure_assumptions
      - followup_live_state_requests
    proof_obligations:
      - every exposure label states declared/static/observed evidence class
    must_not:
      - apply host or runtime assumptions to static manifests without caveat

  - workcell_id: abuse-scenario-analyst
    persona_id: abuse-case-and-attacker-objective-analyst
    role: Generate abuse scenarios and attacker objectives from product flows, user roles, business logic, PII, and deployment context.
    category: abuse-modeler
    required_inputs:
      - component-purpose-map
      - document-intelligence
    optional_inputs:
      - api-collection-intelligence
      - test-intelligence
      - pii-user-data-mapper
      - deployment-topology-mapper
    allowed_actions:
      - propose misuse cases and abuse scenarios
      - define attacker capability and preconditions
      - connect abuse scenarios to DFD elements and data classes
    disallowed_actions:
      - claim exploitability
      - invent product features not supported by evidence
    outputs:
      - proposed_abuse_scenarios
      - attacker_objectives
      - business_harm_notes
      - questions
    proof_obligations:
      - every scenario names actor, objective, harmed asset/user, and cited flow or workflow
    must_not:
      - treat a plausible abuse story as a verified vulnerability

  - workcell_id: stride-enumerator
    persona_id: stride-threat-enumerator
    role: Apply STRIDE systematically to modeled elements and flows.
    category: threat-enumerator
    required_inputs:
      - architecture-dfd-mapper
      - pii-user-data-mapper
      - deployment-topology-mapper
    optional_inputs:
      - source-sast-and-static-leads
      - standards-and-taxonomy-references
      - test-intelligence
    allowed_actions:
      - propose STRIDE hypotheses
      - mark applicable STRIDE categories per element/flow
      - generate proof obligations and verification work items
    disallowed_actions:
      - assign final severity
      - mark a threat verified
    outputs:
      - stride_hypotheses
      - stride_coverage_matrix
      - verification_work_items
    proof_obligations:
      - every STRIDE hypothesis cites an element or flow id
      - unknown attributes become gaps, not confident threats
    must_not:
      - use STRIDE category count as severity

  - workcell_id: attack-tree-builder
    persona_id: attack-tree-and-chain-builder
    role: Build attack trees for high-value objectives and connect leaves to evidence, assumptions, and verification needs.
    category: attack-modeler
    required_inputs:
      - architecture-dfd-mapper
      - abuse-scenario-analyst
      - stride-enumerator
    optional_inputs:
      - deployment-topology-mapper
      - source-sast-and-static-leads
      - sbom-sca-license-lifecycle
      - mobile-native-binary-intelligence
    allowed_actions:
      - propose AND/OR attack tree nodes
      - identify preconditions and missing evidence
      - connect leaves to verification work items
    disallowed_actions:
      - claim complete exploit chains without verified leaves
    outputs:
      - attack_trees
      - chain_gaps
      - verification_work_items
    proof_obligations:
      - every leaf is evidence-backed, assumption-backed, or explicitly unresolved
    must_not:
      - let synthetic links masquerade as evidence

  - workcell_id: domain-specialist-router
    persona_id: target-trait-domain-selector
    role: Select specialized threat-model workcells based on evidence-backed target traits.
    category: selector
    required_inputs:
      - component-purpose-map
      - lane-in-input-bundle
    optional_inputs:
      - all-input-sources
    allowed_actions:
      - select domain workcells
      - record omitted personas and reasons
    disallowed_actions:
      - run every persona by default
    outputs:
      - selected_domain_workcells
      - omitted_workcells
    proof_obligations:
      - every selected workcell has a cited target trait
    must_not:
      - infer applicability from repo name alone

  - workcell_id: challenge-refutation-cell
    persona_id: threat-model-defensive-skeptic
    role: Challenge overconfident model elements, threat hypotheses, attack trees, and privacy/abuse scenarios.
    category: challenger
    required_inputs:
      - intercom-transcript
      - proposed_model_edits
      - proposed_threats
    optional_inputs:
      - test-intelligence
      - source-sast-and-static-leads
      - evidence-index
    allowed_actions:
      - issue challenges
      - narrow or refute unsupported claims
      - request evidence or downgrade confidence
    disallowed_actions:
      - delete dissent silently
      - mark a threat verified
    outputs:
      - challenges
      - confidence_adjustments
      - unresolved_disagreements
    proof_obligations:
      - every challenge cites the claim and the evidence/counterevidence basis
    must_not:
      - refute a claim merely because one citation is weak if other evidence supports it

  - workcell_id: integrator-join
    persona_id: threat-workbench-integrator
    role: Merge workcell outputs into the canonical threat model, diagrams, rankings, and downstream worklists.
    category: integrator
    required_inputs:
      - all-terminal-workcell-results
      - intercom-transcript
    optional_inputs:
      - standards-and-taxonomy-references
    allowed_actions:
      - merge graph edits
      - deduplicate threats
      - preserve dissent and unresolveds
      - produce ranked scenarios and diagrams
    disallowed_actions:
      - fabricate missing workcell output
      - promote candidates to verified findings
    outputs:
      - integrated-threat-model.json
      - threat-workbench-summary.md
      - dfd.mmd
      - attack-trees.mmd
      - stride-radar-data.json
      - ranked-threat-scenarios.json
      - verification-worklist.json
      - assumptions-and-gaps.json
    proof_obligations:
      - every output threat traces to evidence, model element, or unresolved assumption
      - every expected workcell status is represented
    must_not:
      - drop failed or skipped workcells from coverage reporting

