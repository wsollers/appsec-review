# appsec-review/native-toolchain-packages/1
# The one C/C++ toolchain every language build environment compiles with, and the build drivers
# every family may meet (T-058): Autotools, libtool, CMake, Ninja, Meson, pkg-config. A Go module
# with cgo + CMake, a Python package built with scikit-build or meson-python, a Rust crate using the
# cc/cmake crates or a node-gyp addon finds its driver here rather than in a family image. Bazel is
# not here: a JVM binary that fetches rules at build time belongs to a target that needs it (T-050).
# Format: one exact Ubuntu 24.04 (noble) apt pin per line, `name=version`.
# Lines starting with `#` are comments. A consumer installs every pin verbatim:
#   apt-get install -y --no-install-recommends $(grep -v '^#' packages.lock)
