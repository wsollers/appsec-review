schema = "appsec-review/tool/1"
id = "tool-shellcheck"
name = "shellcheck"
version = "0.11.0.1"
license = "GPL-3.0-or-later"
project = "https://github.com/koalaman/shellcheck"
purpose = "shell script static analysis (ShellCheck), offline, JSON (json1) output; the shell lane of 02-source-sast."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/tool/bin/shellcheck"
version_argv = ["/opt/tool/bin/shellcheck", "--version"]
version_expect = "version: 0.11.0"
dependency = "appsec-review/base-python:3.12-bookworm"
update = "Resolve a fixed upstream version, refresh every asset hash and byte size, review license, then run validate/build/smoke."
