schema = "appsec-review/tool/1"
id = "tool-cbmc"
name = "cbmc"
version = "6.11.0"
license = "BSD-4-Clause AND MIT"
project = "https://github.com/diffblue/cbmc"
purpose = "Standalone bounded C/C++ model checking and GOTO tooling; conditional witnesses, not Lean proofs or pipeline verdicts."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/usr/bin/cbmc"
additional_executables = ["/usr/bin/goto-cc", "/usr/bin/goto-instrument", "/usr/bin/timeout"]
version_argv = ["/usr/bin/cbmc", "--version"]
version_expect = "{version}"
dependency = "ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3"
static_adapter = false
update = "Select an upstream Ubuntu amd64 release, refresh the release/license locks, acquire the dependency closure, record its hash/size and packages.manifest, then validate/build and explicitly smoke tool-cbmc."
