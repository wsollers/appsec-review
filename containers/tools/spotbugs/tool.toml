schema = "appsec-review/tool/1"
id = "tool-spotbugs"
name = "spotbugs"
version = "4.10.4"
license = "LGPL-2.1-or-later"
project = "https://github.com/spotbugs/spotbugs"
purpose = "JVM bytecode SAST (SpotBugs + Find Security Bugs)."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/spotbugs/bin/spotbugs"
version_argv = ["/opt/spotbugs/bin/spotbugs", "-version"]
version_expect = "{version}"
dependency = "appsec-review/base-jre:21-noble"
update = "Resolve a fixed upstream version, refresh every asset hash and byte size, review license, then run validate/build/smoke."
