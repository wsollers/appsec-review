schema = "appsec-review/tool/1"
id = "tool-grype"
name = "grype"
version = "0.119.0"
license = "Apache-2.0"
project = "https://github.com/anchore/grype"
purpose = "vulnerability matching of an SBOM against a mirrored, pinned Grype database (grype; ADR-0010 M1)."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/tool/bin/grype"
version_argv = ["/opt/tool/bin/grype", "version"]
version_expect = "{version}"
dependency = "appsec-review/base-ubuntu:24.04"
update = "Resolve a fixed upstream version, refresh every asset hash and byte size, review license, then run validate/build/smoke."
