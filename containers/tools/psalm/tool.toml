schema = "appsec-review/tool/1"
id = "tool-psalm"
name = "psalm"
version = "6.18.1"
license = "MIT"
project = "https://github.com/vimeo/psalm"
purpose = "PHP static analysis with taint analysis (Psalm)."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/tool/bin/psalm"
version_argv = ["/opt/tool/bin/psalm", "--version"]
version_expect = "{version}"
dependency = "appsec-review/base-php:8.4-bookworm"
update = "Resolve a fixed upstream version, refresh every asset hash and byte size, review license, then run validate/build/smoke."
