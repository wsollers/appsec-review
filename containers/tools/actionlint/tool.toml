schema = "appsec-review/tool/1"
id = "tool-actionlint"
name = "actionlint"
version = "1.7.12"
license = "MIT"
project = "https://github.com/rhysd/actionlint"
purpose = "Offline static syntax and semantic checks for explicitly selected GitHub Actions files."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/actionlint/actionlint"
version_argv = ["/opt/actionlint/actionlint", "-version"]
version_expect = "1.7.12"
dependency = "appsec-review/base-ubuntu:24.04"
static_adapter = false
update = "Resolve a fixed upstream release, refresh archive hash and size, review license, then validate/build/smoke offline."
