schema = "appsec-review/tool/1"
id = "tool-svf"
name = "appsec-svf"
version = "3.3.0"
license = "AGPL-3.0-or-later"
project = "https://github.com/SVF-tools/SVF"
purpose = "Offline SVF Andersen points-to and indirect-call analysis over clang-18 bitcode of accepted C/C++ scopes."
static_adapter = false
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/appsec/svf.py"
version_argv = ["/opt/appsec/svf.py", "version"]
version_expect = "appsec-svf {version}"
dependency = "appsec-review/tool-native-cpp:1.0.0"
update = "Bump the SVF release and the LLVM/Z3 inputs its build.sh names in assets.lock.json, rebuild offline, rerun the svf fixtures and live acceptance, then repin image_id in containers/catalog.toml."
