schema = "appsec-review/tool/1"
id = "tool-mobsfscan"
name = "mobsfscan"
version = "1.0.1"
license = "GPL-3.0-only"
project = "https://github.com/MobSF/mobsfscan"
purpose = "mobile-source SAST (mobsfscan)."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/tool/bin/mobsfscan"
version_argv = ["/opt/tool/bin/mobsfscan", "--version"]
version_expect = "{version}"
dependency = "appsec-review/base-python:3.12-bookworm"
update = "Resolve a fixed upstream version, refresh every asset hash and byte size, review license, then run validate/build/smoke."
