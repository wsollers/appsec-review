schema = "appsec-review/tool/1"
id = "tool-osv-scanner"
name = "osv-scanner"
version = "1.9.2"
license = "Apache-2.0"
project = "https://github.com/google/osv-scanner"
purpose = "Offline OSV advisory matching against a supplied immutable local database snapshot."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/tool/bin/osv-scanner"
version_argv = ["/opt/tool/bin/osv-scanner", "--version"]
version_expect = "{version}"
dependency = "appsec-review/base-ubuntu:24.04"
update = "Resolve a fixed upstream version, refresh every asset hash and byte size, review license, then run validate/build/smoke."
