schema = "appsec-review/tool/1"
id = "tool-cppcheck"
name = "cppcheck"
version = "2.22.0"
license = "GPL-3.0-or-later"
project = "https://github.com/cppcheck-opensource/cppcheck"
purpose = "Bounded C/C++ source static analysis; consumes a sanitized compile database when available."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/cppcheck/bin/cppcheck"
version_argv = ["/opt/cppcheck/bin/cppcheck", "--version"]
version_expect = "Cppcheck {version}"
dependency = "appsec-review/base-ubuntu:24.04"
update = "Resolve a fixed upstream release, refresh the source archive hash and byte size, review the GPL license, then run validate/build/smoke."
