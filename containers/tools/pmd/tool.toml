schema = "appsec-review/tool/1"
id = "tool-pmd"
name = "pmd"
version = "7.28.0"
license = "BSD-4-Clause"
project = "https://github.com/pmd/pmd"
purpose = "Java source AST analysis with a repository-pinned security ruleset."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/pmd/bin/pmd"
version_argv = ["/opt/pmd/bin/pmd", "--version"]
version_expect = "PMD {version}"
dependency = "appsec-review/base-jre:21-noble"
rules = "rules/pmd/java-security.xml"
update = "Resolve a stable upstream release, refresh the distribution hash and byte size, review the BSD license and security rules, then run validate/build/smoke."
