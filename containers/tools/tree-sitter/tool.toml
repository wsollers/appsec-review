schema = "appsec-review/tool/1"
id = "tool-tree-sitter"
name = "appsec-tree-sitter"
version = "1.0.0"
license = "MIT"
project = "https://github.com/xberg-io/tree-sitter-language-pack"
purpose = "Offline bounded concrete-syntax-tree production for accepted source scopes."
static_adapter = false
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/appsec/parser.py"
version_argv = ["version"]
version_expect = "appsec-tree-sitter"
dependency = "python:3.12-slim@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f"
update = "Refresh locked wheels and Linux parser libraries with acquire_assets.py, then regenerate assets.lock.json and run live probes."
