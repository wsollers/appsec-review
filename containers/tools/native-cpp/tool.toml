schema = "appsec-review/tool/1"
id = "tool-native-cpp"
name = "appsec-native-cpp"
version = "1.0.0"
license = "Apache-2.0"
project = "repository-local"
purpose = "Offline C/C++ configure, compilation, Clang AST, LLVM IR, and ELF/symbol evidence."
static_adapter = false
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/appsec/native.py"
version_argv = ["/opt/appsec/native.py", "version"]
version_expect = "appsec-native-cpp 1.0.0"
dependency = "ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3"
update = "Refresh the digest-pinned base and exact package versions, then run the constrained functional probes."
