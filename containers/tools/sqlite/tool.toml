schema = "appsec-review/tool/1"
id = "tool-sqlite"
name = "sqlite-tool"
version = "1.0.0"
license = "project-internal"
project = "appsec-review"
purpose = "Read-only, bounded inspection and querying of SQLite databases mounted beneath /target."
static_adapter = false
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/tool/bin/sqlite-tool"
version_argv = ["/opt/tool/bin/sqlite-tool", "version"]
version_expect = "sqlite-tool {version}"
dependency = "appsec-review/base-python:3.12-bookworm"
update = "Bump the wrapper version after review; update the pinned base-python image separately when its SQLite runtime changes."
