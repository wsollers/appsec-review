schema = "appsec-review/tool/1"
id = "tool-blint"
name = "blint"
version = "3.4.0"
license = "MIT"
project = "https://github.com/owasp-dep-scan/blint"
purpose = "binary hardening properties (blint, LIEF), offline; security_properties only."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/tool/bin/blint"
version_argv = ["/opt/tool/bin/python", "-c", "import importlib.metadata as m; print('blint', m.version('blint'))"]
version_expect = "{version}"
dependency = "appsec-review/base-python:3.12-bookworm"
update = "Resolve a fixed upstream version, refresh every asset hash and byte size, review license, then run validate/build/smoke."
