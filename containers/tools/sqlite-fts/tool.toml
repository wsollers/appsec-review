schema = "appsec-review/tool/1"
id = "tool-sqlite-fts"
name = "sqlite-fts"
version = "1.0.0"
license = "NOASSERTION (repository-owned tool; Python-2.0 runtime)"
project = "https://www.sqlite.org/fts5.html"
source = "containers/tools/sqlite-fts/sqlite_fts.py"
purpose = "Offline FTS5 construction and verification from bounded sanitized JSONL records."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/tool/bin/sqlite-fts"
version_argv = ["/opt/tool/bin/sqlite-fts", "version"]
version_expect = "sqlite-fts {version}"
dependency = "appsec-review/base-python:3.12-bookworm"
static_adapter = false
update = "Rebuild on a pinned base-python image; verify FTS5, catalog validation, functional smoke, and image identity."
