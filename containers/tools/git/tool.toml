schema = "appsec-review/tool/1"
id = "tool-git"
name = "git"
version = "2.43.0"
license = "GPL-2.0-only"
project = "https://git-scm.com/"
purpose = "read-only history queries (log, ls-tree, blame) over a sanitized repository view."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/tool/bin/git"
version_argv = ["/opt/tool/bin/git", "--version"]
version_expect = "git version {version}"
dependency = "appsec-review/base-ubuntu:24.04"
static_adapter = false
update = "Resolve a fixed noble-updates package from an immutable snapshot URL, refresh hash and byte size, review license, then run validate/build/smoke."
