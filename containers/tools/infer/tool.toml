schema = "appsec-review/tool/1"
id = "tool-infer"
name = "infer"
version = "1.3.0"
license = "MIT"
project = "https://github.com/facebook/infer"
purpose = "Interprocedural C/C++ memory, lifetime, resource, and concurrency analysis."
static_adapter = false
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/infer/bin/infer"
version_argv = ["/opt/infer/bin/infer", "--version"]
version_expect = "Infer version v{version}"
dependency = "appsec-review/base-ubuntu:24.04"
update = "Select an immutable upstream release, refresh its published SHA-256 and exact byte size, review bundled licenses, then validate, build, smoke, and security-test offline."
