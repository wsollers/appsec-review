schema = "appsec-review/tool/1"
id = "tool-clang-static-analysis"
name = "appsec-clang-static"
version = "1.0.0"
license = "Apache-2.0 WITH LLVM-exception"
project = "https://llvm.org/"
purpose = "Offline Clang-Tidy and Clang Static Analyzer over accepted C/C++ compilation databases."
static_adapter = false
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/appsec/clang-static.py"
version_argv = ["/opt/appsec/clang-static.py", "version"]
version_expect = "appsec-clang-static {version}"
dependency = "appsec-review/tool-native-cpp:1.0.0"
update = "Refresh the pinned native LLVM package closure, then run offline functional and security acceptance."
