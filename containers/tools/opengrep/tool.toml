schema = "appsec-review/tool/1"
id = "tool-opengrep"
name = "opengrep"
version = "1.30.2"
license = "LGPL-2.1"
project = "https://github.com/opengrep/opengrep"
purpose = "source SAST (OpenGrep engine) for the portable SEI CERT rule pack. Rules are mounted per run."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/tool/opengrep/opengrep.bin"
version_argv = ["/opt/tool/opengrep/opengrep.bin", "--version"]
version_expect = "{version}"
dependency = "appsec-review/base-ubuntu:24.04"
update = "Resolve a fixed upstream version, refresh the asset hash and byte size, review license, re-run the SEI CERT pack evaluation under both engines, then run validate/build/smoke."
