schema = "appsec-review/tool/1"
id = "tool-report-latex"
name = "report-latex"
version = "1.0.0"
license = "LPPL-1.3c AND OFL-1.1 AND GPL-2.0-or-later (TeX Live, Inter, JetBrains Mono, poppler)"
project = "https://tug.org/texlive/"
source = "containers/report/latex/render-pdf.sh"
purpose = "Offline deterministic XeTeX rendering of the review report to PDF, plus pdfinfo/pdftotext/pdftoppm structural checks."
architecture = "linux/amd64"
network = "none"
user = "10001:10001"
root_filesystem = "read-only"
target_mount = "read-only"
scratch_mount = "read-write"
capabilities = "drop-all"
security_opt = "no-new-privileges"
memory = "1g"
cpus = "2"
pids_limit = 256
timeout_seconds = 600
output_bytes = 16777216
executable = "/opt/tool/bin/render-pdf"
version_argv = ["/opt/tool/bin/render-pdf", "--version"]
version_expect = "tool-report-latex {version}"
dependency = "ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3"
static_adapter = false
update = "Re-run containers/report/latex/acquire_assets.sh, record the new tar size/SHA-256 in assets.lock.json and commit packages.manifest, then run validate/build/smoke --functional."
