rules:
  - id: appsec.c.strcpy
    languages: [c, cpp]
    message: unsafe copy evidence lead
    severity: WARNING
    pattern-either:
      - pattern: strcpy(...)
      - pattern: std::strcpy(...)
  - id: appsec.c.printf-nonliteral
    languages: [c, cpp]
    message: non-literal format evidence lead
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: printf($FORMAT)
          - pattern: printf($FORMAT, ...)
          - pattern: std::printf($FORMAT)
          - pattern: std::printf($FORMAT, ...)
      - pattern-not: printf("...")
      - pattern-not: printf("...", ...)
      - pattern-not: std::printf("...")
      - pattern-not: std::printf("...", ...)
  - id: appsec.c.memcpy
    languages: [c, cpp]
    message: memory copy evidence lead
    severity: WARNING
    pattern-either:
      - pattern: memcpy(...)
      - pattern: std::memcpy(...)
  - id: appsec.c.system
    languages: [c, cpp]
    message: command execution evidence lead
    severity: WARNING
    pattern-either:
      - pattern: system(...)
      - pattern: std::system(...)
  # Intraprocedural taint (Semgrep CE `mode: taint`): untrusted input reaching a dangerous argument
  # within one function. Sources are process input; propagators carry taint through the C string and
  # memory copies; integer conversions sanitize only where a number cannot carry the weakness.
  # Interprocedural and interfile flow is not tracked (source_sast.RULES_GAP).
  - id: appsec.c.taint.command-injection
    languages: [c, cpp]
    message: untrusted input reaches a command execution argument
    severity: ERROR
    mode: taint
    pattern-sources: &sources
      - patterns:
          - pattern-inside: |
              $RET main(int $ARGC, char **$ARGV) { ... }
          - pattern: $ARGV
      - patterns:
          - pattern-inside: |
              $RET main(int $ARGC, char *$ARGV[]) { ... }
          - pattern: $ARGV
      - pattern-either:
          - pattern: getenv(...)
          - pattern: secure_getenv(...)
          - pattern: std::getenv(...)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: fgets($BUF, ...)
              - pattern: gets($BUF)
              - pattern: getline($BUF, ...)
              - pattern: getdelim($BUF, ...)
              - pattern: read($FD, $BUF, ...)
              - pattern: fread($BUF, ...)
              - pattern: recv($FD, $BUF, ...)
              - pattern: recvfrom($FD, $BUF, ...)
              - pattern: scanf($FMT, ..., $BUF, ...)
              - pattern: scanf($FMT, ..., &$BUF, ...)
              - pattern: fscanf($FP, $FMT, ..., $BUF, ...)
              - pattern: fscanf($FP, $FMT, ..., &$BUF, ...)
              - pattern: sscanf($SRC, $FMT, ..., $BUF, ...)
              - pattern: sscanf($SRC, $FMT, ..., &$BUF, ...)
          - focus-metavariable: $BUF
    pattern-propagators: &propagators
      - {pattern: "strcpy($TO, $FROM)", from: $FROM, to: $TO}
      - {pattern: "strncpy($TO, $FROM, $N)", from: $FROM, to: $TO}
      - {pattern: "strcat($TO, $FROM)", from: $FROM, to: $TO}
      - {pattern: "strncat($TO, $FROM, $N)", from: $FROM, to: $TO}
      - {pattern: "memcpy($TO, $FROM, $N)", from: $FROM, to: $TO}
      - {pattern: "memmove($TO, $FROM, $N)", from: $FROM, to: $TO}
      - {pattern: "sprintf($TO, $FMT, ..., $FROM, ...)", from: $FROM, to: $TO}
      - {pattern: "snprintf($TO, $N, $FMT, ..., $FROM, ...)", from: $FROM, to: $TO}
    pattern-sanitizers: &numeric
      - pattern-either:
          - pattern: atoi(...)
          - pattern: atol(...)
          - pattern: atoll(...)
          - pattern: strtol(...)
          - pattern: strtoll(...)
          - pattern: strtoul(...)
          - pattern: strtoull(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: system($CMD)
              - pattern: std::system($CMD)
              - pattern: popen($CMD, ...)
              - pattern: execl($CMD, ...)
              - pattern: execlp($CMD, ...)
              - pattern: execle($CMD, ...)
              - pattern: execv($CMD, ...)
              - pattern: execvp($CMD, ...)
              - pattern: execvpe($CMD, ...)
              - pattern: execl($P, ..., $CMD, ...)
              - pattern: execlp($P, ..., $CMD, ...)
              - pattern: execle($P, ..., $CMD, ...)
              - pattern: execv($P, $CMD)
              - pattern: execvp($P, $CMD)
              - pattern: execvpe($P, $CMD, ...)
          - focus-metavariable: $CMD
  - id: appsec.c.taint.format-string
    languages: [c, cpp]
    message: untrusted input is used as a format string
    severity: ERROR
    mode: taint
    pattern-sources: *sources
    pattern-propagators: *propagators
    pattern-sanitizers: *numeric
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: printf($FMT, ...)
              - pattern: vprintf($FMT, ...)
              - pattern: fprintf($FP, $FMT, ...)
              - pattern: vfprintf($FP, $FMT, ...)
              - pattern: dprintf($FD, $FMT, ...)
              - pattern: sprintf($BUF, $FMT, ...)
              - pattern: vsprintf($BUF, $FMT, ...)
              - pattern: snprintf($BUF, $N, $FMT, ...)
              - pattern: vsnprintf($BUF, $N, $FMT, ...)
              - pattern: syslog($PRI, $FMT, ...)
              - pattern: err($CODE, $FMT, ...)
              - pattern: warn($FMT, ...)
          - focus-metavariable: $FMT
  - id: appsec.c.taint.unsafe-copy
    languages: [c, cpp]
    message: untrusted input reaches an unbounded string copy
    severity: ERROR
    mode: taint
    pattern-sources: *sources
    pattern-propagators: *propagators
    pattern-sanitizers: *numeric
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: strcpy($DST, $SRC)
              - pattern: strcat($DST, $SRC)
              - pattern: std::strcpy($DST, $SRC)
              - pattern: std::strcat($DST, $SRC)
              - pattern: sprintf($DST, $FMT, ..., $SRC, ...)
              - pattern: vsprintf($DST, $FMT, $SRC)
          - focus-metavariable: $SRC
  - id: appsec.c.taint.memcpy-length
    languages: [c, cpp]
    message: untrusted input controls a memory copy length
    severity: ERROR
    mode: taint
    pattern-sources: *sources
    pattern-propagators: *propagators
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: memcpy($DST, $SRC, $LEN)
              - pattern: memmove($DST, $SRC, $LEN)
              - pattern: std::memcpy($DST, $SRC, $LEN)
              - pattern: std::memmove($DST, $SRC, $LEN)
              - pattern: strncpy($DST, $SRC, $LEN)
              - pattern: strncat($DST, $SRC, $LEN)
          - focus-metavariable: $LEN
