# Single tracked operational configuration. Secrets and host-local identities do not belong here.
# Units are explicit in key names. Job and task identities are stable namespaces, not list positions.

[global]
worker_pool_size = 4
model = "haiku"
reasoning_level = "medium"
budget_usd = 2.0
timeout_seconds = 3600
cache_policy = "validated_reuse"
retrieval_max_results = 200
applicability_threshold = 0.5

[job_0000.run_configuration]
job_id = "00-run-configuration"
worker_pool_size = 1
timeout_seconds = 30
cache_policy = "disabled"

[job_0000.run_configuration.task_0001]
timeout_seconds = 15
retrieval_max_results = 20

[job_0002.repository_partition_discovery]
job_id = "02-repository-partition-discovery"
model = "claude-sonnet-5"
reasoning_level = "medium"
budget_usd = 2.0
timeout_seconds = 3600
applicability_threshold = 0.0
