# ADR-0011: the containers (webserver, daemon) and the host code location + its run workers share
# this instance. The daemon passes its instance ref to the host run worker, and env-sourced values
# stay unresolved in that ref, so each process resolves them from its own environment:
# compose.yaml sets the container values, code-location.sh the host ones.
storage:
  postgres:
    postgres_db:
      username: appsec
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      db_name: appsec_dagster
      port:
        env: DAGSTER_PG_PORT
compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir:
      env: DAGSTER_COMPUTE_LOG_DIR
local_artifact_storage:
  module: dagster._core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir:
      env: DAGSTER_ARTIFACT_DIR
telemetry:
  enabled: false
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 2
    dequeue_interval_seconds: 2
    tag_concurrency_limits:
      - key: engagement_run_id
        value:
          applyLimitPerUniqueValue: true
        limit: 1
      - key: nvd_feed_id
        limit: 1
concurrency:
  default_op_concurrency_limit: 1
run_monitoring:
  enabled: true
  poll_interval_seconds: 30
  start_timeout_seconds: 120
  cancel_timeout_seconds: 30
  max_resume_run_attempts: 0
  free_slots_after_run_end_seconds: 120
