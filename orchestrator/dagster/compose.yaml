name: appsec-review
# ADR-0011: Dagster's orchestration layer only -- postgres, webserver, daemon. Op execution runs in the
# host-owned code location (code-location.sh / .ps1, `dagster api grpc` on port 4000), which ops use
# to reach host Docker directly. Nothing here mounts run data, the process tree, targets or a Docker
# socket.
x-runtime: &runtime
  image: appsec-review-dagster:local
  # Native Linux: setup.py records the host uid/gid so the services' own files (compute logs under the
  # bind-mounted .host/) belong to the operator. Unset (Docker Desktop, Windows) keeps root.
  user: "${APPSEC_UID:-0}:${APPSEC_GID:-0}"
  environment:
    DAGSTER_HOME: /opt/dagster/home
    DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:?Run setup first}
    DAGSTER_PG_HOST: postgres
    DAGSTER_PG_PORT: "5432"
    DAGSTER_COMPUTE_LOG_DIR: /var/dagster/compute-logs
    DAGSTER_ARTIFACT_DIR: /var/dagster/artifacts
    HOME: /tmp
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - dagster-storage:/var/dagster
    # Run workers execute on the host and write compute logs to .host/compute-logs; the webserver
    # reads the same directory so stdout/stderr stay visible in the UI.
    - ./.host/compute-logs:/var/dagster/compute-logs
    - ./dagster.yaml:/opt/dagster/home/dagster.yaml:ro
    - ./workspace.yaml:/opt/dagster/home/workspace.yaml:ro
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_USER: appsec
      POSTGRES_DB: appsec_dagster
      POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:?Run setup first}
    # Published on loopback only: the host code location and its run workers share this instance.
    ports:
      - "127.0.0.1:${APPSEC_PG_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U appsec -d appsec_dagster"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  webserver:
    <<: *runtime
    build: .
    command: [dagster-webserver, -h, 0.0.0.0, -p, "3000", -w, /opt/dagster/home/workspace.yaml]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
  daemon:
    <<: *runtime
    command: [dagster-daemon, run, -w, /opt/dagster/home/workspace.yaml]
    healthcheck:
      test: [CMD, dagster-daemon, liveness-check]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 60s
volumes:
  postgres-data:
  dagster-storage:
