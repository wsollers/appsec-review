# LAN image registry for shared images (ADR-0033). Runs on zarathustra only:
#   docker compose -f orchestrator/image-registry/compose.yaml up -d
# hal5000 publishes to it (images/image_build.py publish) and every host pulls from it by digest.
# Plain HTTP on the LAN, no auth: each host lists 192.168.1.228:5000 under "insecure-registries".
# Pulls are by the manifest digest committed in images/published.lock.json, so a push by anyone
# else on the LAN cannot change what a host runs.
name: appsec-image-registry
services:
  registry:
    image: docker.io/library/registry:2.8.3   # TODO: pin by digest on first pull (docker image inspect)
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"   # lets old images be deleted and garbage-collected
    volumes:
      - image-registry-data:/var/lib/registry
volumes:
  image-registry-data:
