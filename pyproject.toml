[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-review"
version = "0.0.0"
description = "Evidence-backed application security review orchestration"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20", "PyYAML==6.0.3", "redis==8.1.0", "zstandard==0.25.0", "tzdata; platform_system == 'Windows'"]

[project.scripts]
appsec-review = "appsec_review.cli:main"
appsec-review-mcp = "appsec_review.mcp.stdio:main"
appsec-review-native = "appsec_review.orchestration.dagster.native_operator:main"

[project.optional-dependencies]
copilot = ["github-copilot-sdk==1.0.25"]
# Validator, evaluation harness, and tests for rules/sei-cert. The review runtime does not need it.
# Pinned to the version in deploy/dagster/requirements.lock.txt.
rulepacks = ["PyYAML==6.0.3"]
# Host test dependencies: tests/review and others use hypothesis, and the SEI CERT rule-pack tests use
# PyYAML. PyYAML is pinned to the deploy/dagster/requirements.lock.txt version.
test = [
    "pytest>=8",
    "pytest-xdist==3.8.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.0",
    "PyYAML==6.0.3",
]
quality = [
    "ruff==0.14.2",
    "mypy==1.18.2",
    "bandit==1.8.6",
    "pytest==8.4.2",
    "setuptools==80.9.0",
]
dagster = [
    "dagster==1.13.21",
    "dagster-postgres==0.29.21",
    "dagster-webserver==1.13.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"appsec_review.jobs.job_dependency_intelligence" = ["schemas/*.json", "schemas/*.txt", "schemas/*.md"]

[tool.setuptools.data-files]
"share/appsec-review/schemas" = ["docs/schemas/review-packages.schema.json",
                                 "docs/schemas/review-package-view.schema.json",
                                 "docs/schemas/review-package-manifest.schema.json",
                                 "docs/schemas/review-package-unit-context.schema.json"]
"share/appsec-review/schemas/openvex-export" = ["docs/schemas/openvex-export/*.json"]
"share/appsec-review/schemas/openvex-export/upstream" = ["docs/schemas/openvex-export/upstream/*"]
"share/appsec-review/schemas/final-report" = ["docs/schemas/final-report/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=test/tmp"
cache_dir = "test/tmp/.pytest_cache"
# Per-test budgets (seconds) for tests/unit, tests/integration and tests/live; see
# docs/architecture/testing.md.
unit_time_budget_seconds = "10"
integration_time_budget_seconds = "300"
live_time_budget_seconds = "1800"

[tool.ruff]
target-version = "py311"
line-length = 110
cache-dir = "test/tmp/.ruff_cache"

[tool.ruff.lint]
# Initial correctness rules, not a repository-wide style migration.
select = ["E9", "F811", "F821", "F822", "F823"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"
warn_unused_configs = true
cache_dir = "test/tmp/.mypy_cache"
files = [
    "tools/quality",
    "src/appsec_review/runtime/job.py",
    "src/appsec_review/runtime/plan.py",
    "src/appsec_review/storage/atomic.py",
    "src/appsec_review/storage/validation.py",
    "src/appsec_review/inference/request.py",
]

[tool.appsec-quality]
version = 1
source_roots = ["src/appsec_review", "tools/quality"]
baseline = "quality/baseline.json"
timeout_seconds = 120
sast_rules = ["B102", "B301", "B307", "B506", "B602"]
# These are offline contract sentinels, NOT a second job-to-test registry.
unit_tests = [
    "tests/quality/test_config_selection.py",
    "tests/quality/test_boundaries_baseline.py",
    "tests/quality/test_runner.py",
    "tests/quality/test_workflows.py",
]
contract_tests = [
    "tests/test_config.py",
    "tests/test_pytest_default_collection.py",
    "tests/test_review_model_request.py",
]
quality_prefixes = ["tools/quality/", "tests/quality/", "quality/"]
documentation_prefixes = ["docs/"]
shared_paths = [
    "pyproject.toml", "requirements/quality.lock", "appsec-review.toml",
    "tests/conftest.py", ".github/workflows/quality.yml",
]
bootstrap_modules = [
    "appsec_review.signing.bootstrap",
    "appsec_review.signing.core",
    "appsec_review.signing.modules",
    "appsec_review.signing.import_hook",
    "appsec_review.signing.release_lib",
    "appsec_review.signing.sitecustomize_shim",
]
public_contracts = [
    "appsec_review.runtime.job",
    "appsec_review.runtime.plan",
    "appsec_review.inference.request",
    "appsec_review.storage.atomic",
    "appsec_review.storage.validation",
]
