[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-review"
version = "0.0.0"
description = "Evidence-backed application security review orchestration"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20", "tzdata; platform_system == 'Windows'"]

[project.scripts]
appsec-review = "appsec_review.cli:main"
appsec-review-mcp = "appsec_review.mcp.stdio:main"

[project.optional-dependencies]
# Validator, evaluation harness, and tests for rules/sei-cert. The review runtime does not need it.
# Pinned to the version in deploy/dagster/requirements.lock.txt.
rulepacks = ["PyYAML==6.0.3"]
# Lets tests run the tool-tree-sitter parser and asset scripts on the host. Pinned to the versions
# containers/tools/tree-sitter installs.
treesitter = ["tree-sitter==0.26.0", "tree-sitter-language-pack==1.12.5"]
dagster = [
    "dagster==1.13.21",
    "dagster-postgres==0.29.21",
    "dagster-webserver==1.13.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/appsec-review/schemas" = ["docs/schemas/review-packages.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=test/tmp"
cache_dir = "test/tmp/.pytest_cache"
