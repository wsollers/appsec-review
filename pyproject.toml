[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-review"
version = "0.0.0"
description = "Evidence-backed application security review orchestration"
requires-python = ">=3.11"

[project.scripts]
appsec-review = "appsec_review.cli:main"

[project.optional-dependencies]
dagster = [
    "dagster==1.13.21",
    "dagster-postgres==0.29.21",
    "dagster-webserver==1.13.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
